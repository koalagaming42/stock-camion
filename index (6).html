<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stock Camion">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Stock Camion</title>
<style>
:root{
  --bg:#f3f5f8;--card:#fff;--text:#18202b;--muted:#6b7686;--line:#e2e6ec;
  --primary:#1f3a5f;--primary-2:#2d5a8e;--ok:#1f9d55;--warn:#d98a00;--bad:#d64545;
  --chip:#eef2f7;--shadow:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f141b;--card:#18202b;--text:#e8edf3;--muted:#8d99a8;--line:#273241;
  --primary:#4f86c6;--primary-2:#6a9fdc;--chip:#223042;--shadow:none;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:10;background:var(--primary);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:19px;margin:0;font-weight:700}
.bell{position:relative;background:none;border:0;color:#fff;font-size:24px;padding:4px 8px}
.badge{position:absolute;top:-2px;right:0;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:10px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
main{padding:12px 16px calc(90px + env(safe-area-inset-bottom));max-width:700px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:9px 0 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button span.i{font-size:21px}
nav button.active{color:var(--primary)}
nav .badge{top:4px;right:calc(50% - 22px)}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line);padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.qty{font-size:22px;font-weight:700;min-width:44px;text-align:center}
.qty.low{color:var(--bad)}.qty.mid{color:var(--warn)}.qty.ok{color:var(--ok)}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;background:var(--chip);color:var(--text)}
.btn.primary{background:var(--primary);color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.block{width:100%;margin-top:8px}
.round{width:42px;height:42px;border-radius:50%;border:0;font-size:22px;font-weight:700;background:var(--chip);color:var(--text)}
.round.minus{color:var(--bad)}.round.plus{color:var(--ok)}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:16px;font-family:inherit}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{flex:none;border:0;background:var(--chip);color:var(--text);border-radius:16px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--primary);color:#fff}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle}
.tag.bad{background:#fde8e8;color:var(--bad)}.tag.info{background:#e6effa;color:var(--primary-2)}
@media (prefers-color-scheme: dark){.tag.bad{background:#3a1d1d}.tag.info{background:#1d2c3f}}
h2{font-size:17px;margin:6px 0 10px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:30px;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:9}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:700px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px;font-size:18px}
.hist .d{font-weight:700;min-width:46px;text-align:right}
.hist .d.p{color:var(--ok)}.hist .d.m{color:var(--bad)}
.notif{border-left:4px solid var(--warn)}
.notif.read{opacity:.55;border-left-color:var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.undobar{position:fixed;left:12px;right:12px;bottom:calc(var(--navh,60px) + 8px);max-width:676px;margin:0 auto;background:#222;color:#fff;border-radius:12px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;z-index:31;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3);transform:translateY(20px);opacity:0;visibility:hidden;pointer-events:none;transition:transform .25s,opacity .25s,visibility .25s}
.undobar.show{transform:none;opacity:1;visibility:visible;pointer-events:auto}
/* Quand la barre Annuler est affichée : la page lui laisse sa place, rien n'est caché */
body.undo-on main{padding-bottom:calc(var(--navh,60px) + 90px + env(safe-area-inset-bottom))}
body.undo-on .fab{bottom:calc(var(--navh,60px) + 76px)}
body.undo-on .toast{bottom:calc(var(--navh,60px) + 130px)}
.undobar span{flex:1}
.undobar button{border:0;border-radius:8px;background:#ffc107;color:#222;font-weight:700;font-size:14px;padding:9px 12px}
.alertbar{background:#fff4e0;color:#8a5a00;border:1px solid #f1d39a;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;display:flex;align-items:center;gap:8px}
@media (prefers-color-scheme: dark){.alertbar{background:#3a2c10;color:#f3c66b;border-color:#5a4418}}
.check{width:24px;height:24px;flex:none;accent-color:var(--primary)}
.smallnum{width:70px;text-align:center;padding:8px}
.preview{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:260px;overflow:auto}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.center{text-align:center}
.hbtns{display:flex;gap:2px}
.oddot{position:absolute;right:4px;bottom:6px;width:10px;height:10px;border-radius:50%;border:2px solid var(--primary);background:#9aa5b1}
.oddot.ok{background:#2ecc71}.oddot.wait{background:#ffc107}.oddot.err{background:#e74c3c}
.odstat{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}
.infobar{background:#e6effa;color:var(--primary-2);border-color:#b9d0ec}
@media (prefers-color-scheme: dark){.infobar{background:#1d2c3f;color:#9cc2ee;border-color:#2c4566}}
</style>
</head>
<body>

<header>
  <h1>🚐 Stock Camion</h1>
  <div class="hbtns">
    <button class="bell" id="odBadge" onclick="go('settings')" aria-label="OneDrive" hidden>☁️<span class="oddot" id="odDot"></span></button>
    <button class="bell" onclick="openNotifs()" aria-label="Notifications">🔔<span class="badge" id="bellBadge" hidden>0</span></button>
  </div>
</header>

<main id="view"></main>

<button class="fab" id="fab" onclick="openItem()" aria-label="Ajouter un article">+</button>

<nav>
  <button data-tab="stock" class="active" onclick="go('stock')"><span class="i">📦</span>Stock</button>
  <button data-tab="order" onclick="go('order')"><span class="i">🛒</span>À commander<span class="badge" id="orderBadge" hidden>0</span></button>
  <button data-tab="history" onclick="go('history')"><span class="i">🕘</span>Historique</button>
  <button data-tab="settings" onclick="go('settings')"><span class="i">⚙️</span>Réglages</button>
</nav>

<div class="sheet-bg" id="sheetBg" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="undobar" id="undoBar"><span id="undoMsg"></span><button onclick="undo()">↩️ Annuler</button></div>
<input type="file" id="impGlobal" accept=".json,application/json" hidden onchange="importData(this.files[0]);this.value=''">

<script src="msal-browser.min.js"></script>
<script src="xlsx-lite.js"></script>
<script>
/* ============ Stockage local ============ */
const KEY = 'stockCamion_v1';
let memoryFallback = null;
const defaults = () => ({
  items: [],
  history: [],
  notifs: [],
  orders: [],
  settings: {
    to: '', cc: '', tech: '',
    odClientId: 'e111e96e-5b48-406d-8b45-7dd545ad91d9', // appli « Stock Camion » déclarée chez Microsoft (non secret)
    subject: 'Demande de réapprovisionnement camion – {date}',
    intro: `Salut,\n\nAvec les dernières installs et dépannages, je commence à être juste sur certaines pièces dans le camion. Pour ne pas me retrouver bloqué en intervention pourrais-tu me commander ça s'il te plait :`,
    outro: 'Merci d\'avance.\n\nCordialement,\n{nom}'
  },
  lastCat: 'Tous'
});
function load(){
  try {
    const s = localStorage.getItem(KEY);
    if (s) {
      const d = defaults(), saved = JSON.parse(s), st = Object.assign({}, d.settings, saved.settings || {});
      // Un champ resté vide reprend la valeur par défaut (nom, adresse…)
      for (const k in d.settings) if (!st[k] && d.settings[k]) st[k] = d.settings[k];
      // Anciens textes par défaut jamais modifiés → remplacés par le nouveau
      const oldIntros = [
        'Bonjour,\n\nPeux-tu passer commande du matériel suivant pour mon camion :',
        `Bonjour,\n\nSuite au suivi de stock de mon véhicule d'intervention, plusieurs articles sont passés sous leur seuil minimum après les dernières installations, mises en service et opérations de maintenance.\n\nAfin de pouvoir continuer à assurer les interventions planifiées et les dépannages urgents dans les délais, sans retour au dépôt ni report de rendez-vous client, peux-tu passer commande du matériel suivant :`,
        `Salut,\n\nAvec les dernières installs et dépannages, je commence à être juste sur certaines pièces dans le camion. Pour ne pas me retrouver bloqué en intervention ou devoir repasser au dépôt, tu pourrais me commander ça :`
      ];
      if (oldIntros.includes(st.intro)) st.intro = d.settings.intro;
      return Object.assign(d, saved, {settings: st});
    }
  }
  catch(e){ if (memoryFallback) return memoryFallback; }
  return defaults();
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ memoryFallback = S; }
  updateBadges();
  try { odDirty(); } catch(e){} // synchro OneDrive (si activée)
}
let S = load();

/* ============ Sécurité des données ============ */
// Vérifie que le téléphone enregistre bien les données
let storageOK = true;
try { localStorage.setItem('__test', '1'); localStorage.removeItem('__test'); } catch(e){ storageOK = false; }
// Demande au navigateur de ne pas effacer les données de l'appli quand il fait du ménage
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
const BACKUP_DAYS = 7;
const daysSinceBackup = () => {
  // Un envoi OneDrive réussi compte comme une sauvegarde
  let last = S.lastBackup || 0;
  try { const m = JSON.parse(localStorage.getItem('stockCamion_onedrive')) || {}; if (m.last > last) last = m.last; } catch(e){}
  return last ? Math.floor((Date.now() - last) / 864e5) : null;
};
function safetyBanner(){
  if (!storageOK) return `<div class="alertbar" style="background:#fde8e8;color:var(--bad);border-color:#f3b4b4">⛔ <div class="grow"><b>Les données ne sont pas enregistrées</b> sur ce navigateur : tout sera perdu à la fermeture. Ouvre l'appli avec <b>Chrome</b> (ou Safari sur iPhone).</div></div>`;
  const d = daysSinceBackup();
  if (S.items.length && (d === null || d >= BACKUP_DAYS))
    return `<div class="alertbar" onclick="exportData()">💾 <div class="grow">${d === null ? 'Aucune sauvegarde faite' : `Dernière sauvegarde il y a <b>${d} jours</b>`} — appuie ici pour sauvegarder</div>›</div>`;
  return '';
}
let tab = 'stock', search = '', catFilter = 'Tous';

/* ============ Utilitaires ============ */
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = t => new Date(t).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const today = () => new Date().toLocaleDateString('fr-FR');
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
const isLow = it => it.qty <= it.min;
const toOrderQty = it => Math.max((it.target || it.min) - it.qty, it.qty <= it.min ? 1 : 0);
const lowItems = () => S.items.filter(isLow);
const cats = () => ['Tous', ...[...new Set(S.items.map(i => i.cat || 'Divers'))].sort()];

/* ============ Notifications internes ============ */
function checkThreshold(it, before){
  // Passage sous le seuil → notification
  if (it.qty <= it.min && before > it.min) {
    S.notifs.unshift({id:uid(), t:Date.now(), itemId:it.id, read:false,
      msg:`⚠️ ${it.name} est passé sous le seuil (${it.qty} restant, seuil ${it.min}). À recommander.`});
    toast(`⚠️ ${it.name} à recommander`);
  }
  if (it.qty === 0 && before > 0) {
    S.notifs.unshift({id:uid(), t:Date.now(), itemId:it.id, read:false,
      msg:`🚫 ${it.name} est en rupture dans le camion.`});
  }
  // Retour au-dessus du seuil → on réinitialise le statut "commandé"
  if (it.qty > it.min && !pendingQty(it.id)) it.ordered = false;
  S.notifs = S.notifs.slice(0, 200);
}
function updateBadges(){
  const unread = S.notifs.filter(n => !n.read).length;
  const low = lowItems().filter(i => !i.ordered).length;
  $('bellBadge').hidden = !unread; $('bellBadge').textContent = unread;
  $('orderBadge').hidden = !low; $('orderBadge').textContent = low;
}

/* ============ Mouvements ============ */
function move(id, delta, note, quiet){
  const it = S.items.find(i => i.id === id); if (!it || !delta) return;
  const before = it.qty;
  it.qty = Math.max(0, it.qty + delta);
  const real = it.qty - before; if (!real) return;
  S.history.unshift({id:uid(), t:Date.now(), itemId:id, name:it.name, delta:real, after:it.qty, note:note||''});
  S.history = S.history.slice(0, 1000);
  checkThreshold(it, before);
  if (!quiet) { save(); render(); }
}

/* ============ Navigation ============ */
function go(t){
  tab = t;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  $('fab').style.display = t === 'stock' ? '' : 'none';
  render(); window.scrollTo(0,0);
}
function render(){
  ({stock:renderStock, order:renderOrder, history:renderHistory, settings:renderSettings})[tab]();
  updateBadges();
}

/* ============ Vue Stock ============ */
function renderStock(){
  const q = search.toLowerCase();
  const list = S.items
    .filter(i => catFilter === 'Tous' || (i.cat || 'Divers') === catFilter)
    .filter(i => !q || (i.name + ' ' + (i.ref||'') + ' ' + (i.cat||'')).toLowerCase().includes(q))
    .sort((a,b) => (isLow(b) - isLow(a)) || a.name.localeCompare(b.name,'fr',{numeric:true}));
  const lowN = lowItems().filter(i => !i.ordered).length;
  $('view').innerHTML = `
    ${safetyBanner()}
    ${openOrders().length ? `<div class="alertbar infobar" onclick="go('order')">📦 <div class="grow"><b>${openOrders().length} commande${openOrders().length>1?'s':''}</b> en attente de réception</div>›</div>` : ''}
    ${lowN ? `<div class="alertbar" onclick="go('order')">⚠️ <div class="grow"><b>${lowN} article${lowN>1?'s':''}</b> sous le seuil — à recommander</div>›</div>` : ''}
    <div class="toolbar"><input type="search" placeholder="Rechercher (nom, réf…)" value="${esc(search)}" oninput="search=this.value;renderStockList()"></div>
    <div class="chips">${cats().map(c => `<button class="chip ${c===catFilter?'on':''}" onclick="catFilter='${esc(c)}';render()">${esc(c)}</button>`).join('')}</div>
    <div id="stockList"></div>`;
  renderStockList(list);
}
function renderStockList(list){
  if (!list) { // appelé par la recherche
    const q = search.toLowerCase();
    list = S.items.filter(i => catFilter === 'Tous' || (i.cat||'Divers') === catFilter)
      .filter(i => !q || (i.name+' '+(i.ref||'')+' '+(i.cat||'')).toLowerCase().includes(q))
      .sort((a,b) => (isLow(b)-isLow(a)) || a.name.localeCompare(b.name,'fr',{numeric:true}));
  }
  $('stockList').innerHTML = list.length ? list.map(it => {
    const cls = it.qty <= it.min ? 'low' : (it.qty <= it.min * 1.5 ? 'mid' : 'ok');
    return `<div class="card row">
      <div class="grow" onclick="openMove('${it.id}')">
        <div class="name">${esc(it.name)}${pendingQty(it.id)?`<span class="tag info">${pendingQty(it.id)} attendu${pendingQty(it.id)>1?'s':''}</span>`:it.ordered?'<span class="tag info">Commandé</span>':(isLow(it)?'<span class="tag bad">Bas</span>':'')}</div>
        <div class="sub">${esc(it.ref||'')}${it.ref?' · ':''}${esc(it.cat||'Divers')} · seuil ${it.min}${it.target?' / cible '+it.target:''}</div>
      </div>
      <button class="round minus" onclick="move('${it.id}',-1)">−</button>
      <div class="qty ${cls}">${it.qty}</div>
      <button class="round plus" onclick="move('${it.id}',1)">+</button>
    </div>`;
  }).join('') : `<div class="empty">${S.items.length ? 'Aucun résultat.' : `Ton stock est vide.<br>Appuie sur <b>+</b> pour ajouter ton premier article.
      ${S.history.length ? '' : `<br><br>Tu avais déjà des données ?<button class="btn primary block" onclick="$('impGlobal').click()">📥 Restaurer une sauvegarde</button>
      <div class="hint">Si tes articles ont disparu, c'est souvent que l'appli a été ouverte depuis un autre fichier ou un autre navigateur. Ouvre-la toujours au même endroit, ou restaure ta dernière sauvegarde.</div>`}`}</div>`;
}

/* ============ Fiche article / mouvement ============ */
function openSheet(html){ $('sheet').innerHTML = html; $('sheetBg').classList.add('show'); $('undoBar').classList.remove('show'); }
function sheetClosedUndo(){ if (undoSnap) $('undoBar').classList.add('show'); }
function closeSheet(){ $('sheetBg').classList.remove('show'); sheetClosedUndo(); }

function openMove(id){
  const it = S.items.find(i => i.id === id);
  const last = S.history.filter(h => h.itemId === id).slice(0,5);
  openSheet(`
    <h3>${esc(it.name)}</h3>
    <div class="sub">${esc(it.ref||'')} ${it.ref?'·':''} ${esc(it.cat||'Divers')} — en stock : <b>${it.qty}</b> (seuil ${it.min})</div>
    <label>Quantité</label>
    <input id="mvQty" type="number" inputmode="numeric" min="1" value="1">
    <label>Note (chantier, client…) – facultatif</label>
    <input id="mvNote" placeholder="ex. Chantier Dupont">
    <div class="grid2" style="margin-top:12px">
      <button class="btn danger" onclick="doMove('${id}',-1)">− Retirer</button>
      <button class="btn ok" onclick="doMove('${id}',1)">+ Ajouter</button>
    </div>
    ${last.length ? `<label style="margin-top:16px">Derniers mouvements</label>${last.map(h=>`<div class="sub">${fmtDate(h.t)} : <b>${h.delta>0?'+':''}${h.delta}</b> ${esc(h.note)}</div>`).join('')}` : ''}
    <button class="btn block" onclick="openItem('${id}')">✏️ Modifier l'article</button>
    <button class="btn block" onclick="closeSheet()">Fermer</button>`);
}
function doMove(id, sign){
  const n = parseInt($('mvQty').value, 10);
  if (!n || n < 1) return toast('Quantité invalide');
  move(id, sign * n, $('mvNote').value.trim());
  closeSheet(); toast(sign > 0 ? `+${n} ajouté` : `−${n} retiré`);
}

function openItem(id){
  const it = id ? S.items.find(i => i.id === id) : {name:'',ref:'',cat:S.lastCat||'',qty:0,min:1,target:''};
  openSheet(`
    <h3>${id ? 'Modifier l\'article' : 'Nouvel article'}</h3>
    <label>Désignation *</label><input id="fName" value="${esc(it.name)}" placeholder="ex. Détecteur de mouvement">
    <div class="grid2">
      <div><label>Référence</label><input id="fRef" value="${esc(it.ref)}" placeholder="ex. DET-200"></div>
      <div><label>Catégorie</label><input id="fCat" list="catList" value="${esc(it.cat)}" placeholder="ex. Détection">
        <datalist id="catList">${cats().slice(1).map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
    </div>
    <div class="grid3">
      <div><label>En stock</label><input id="fQty" type="number" inputmode="numeric" min="0" value="${it.qty}"></div>
      <div><label>Seuil alerte</label><input id="fMin" type="number" inputmode="numeric" min="0" value="${it.min}"></div>
      <div><label>Stock cible</label><input id="fTarget" type="number" inputmode="numeric" min="0" value="${it.target}"></div>
    </div>
    <div class="hint">Alerte quand le stock ≤ seuil. La quantité à commander = stock cible − stock actuel.</div>
    <button class="btn primary block" onclick="saveItem('${id||''}')">Enregistrer</button>
    ${id ? `<button class="btn danger block" onclick="delItem('${id}')">Supprimer l'article</button>` : ''}
    <button class="btn block" onclick="closeSheet()">Annuler</button>`);
  setTimeout(()=>{ if(!id) $('fName').focus(); }, 50);
}
function saveItem(id){
  const name = $('fName').value.trim(); if (!name) return toast('La désignation est obligatoire');
  const data = {
    name, ref: $('fRef').value.trim(), cat: $('fCat').value.trim() || 'Divers',
    qty: Math.max(0, parseInt($('fQty').value,10) || 0),
    min: Math.max(0, parseInt($('fMin').value,10) || 0),
    target: parseInt($('fTarget').value,10) || ''
  };
  S.lastCat = data.cat;
  if (id) {
    const it = S.items.find(i => i.id === id); const before = it.qty;
    if (data.qty !== before) S.history.unshift({id:uid(), t:Date.now(), itemId:id, name, delta:data.qty-before, after:data.qty, note:'Correction inventaire'});
    Object.assign(it, data); checkThreshold(it, before > it.min ? before : it.min + 1);
  } else {
    const it = {id:uid(), ordered:false, ...data}; S.items.push(it);
    if (isLow(it)) checkThreshold(it, it.min + 1);
  }
  save(); closeSheet(); render(); toast('Article enregistré');
}
function delItem(id){
  if (!confirm('Supprimer cet article du stock ?')) return;
  snapshot();
  S.items = S.items.filter(i => i.id !== id); save(); closeSheet(); render(); offerUndo('Article supprimé');
}

/* ============ Vue À commander ============ */
let selection = {}; // id -> qty à commander
function renderOrder(){
  const low = lowItems().sort((a,b) => (a.ordered - b.ordered) || a.name.localeCompare(b.name,'fr',{numeric:true}));
  low.forEach(it => { if (!(it.id in selection)) selection[it.id] = it.ordered ? 0 : toOrderQty(it); });
  const sel = low.filter(i => selection[i.id] > 0);
  const oo = openOrders();
  $('view').innerHTML = `
    ${oo.length ? `<h2>📦 En attente de réception</h2>${oo.map(orderCard).join('')}` : ''}
    <h2>Articles à recommander</h2>
    ${low.length ? low.map(it => `
      <div class="card row">
        <input type="checkbox" class="check" ${selection[it.id]>0?'checked':''} onchange="selection['${it.id}']=this.checked?${toOrderQty(it)}:0;renderOrder()">
        <div class="grow">
          <div class="name">${esc(it.name)}</div>
          <div class="sub">${esc(it.ref||'')}${it.ref?' · ':''}stock ${it.qty} / seuil ${it.min}${pendingQty(it.id)?` · <b>⏳ ${pendingQty(it.id)} attendu${pendingQty(it.id)>1?'s':''}</b>`:(it.ordered?' · <b>déjà demandé</b>':'')}</div>
        </div>
        <input class="smallnum" type="number" inputmode="numeric" min="0" value="${selection[it.id]}" onchange="selection['${it.id}']=Math.max(0,parseInt(this.value,10)||0);renderOrder()">
      </div>`).join('') : '<div class="empty">✅ Rien à recommander pour le moment.</div>'}
    ${low.length ? `
      <button class="btn primary block" ${sel.length?'':'disabled style="opacity:.5"'} onclick="previewMail()">✉️ Envoyer au responsable (${sel.length})</button>
      <button class="btn block" onclick="addManual()">+ Ajouter un article hors seuil</button>` : `<button class="btn block" onclick="addManual()">+ Ajouter un article à la demande</button>`}`;
}
function addManual(){
  const others = S.items.filter(i => !isLow(i));
  if (!others.length) return toast('Aucun autre article dans le stock');
  openSheet(`<h3>Ajouter à la commande</h3>
    <label>Article</label><select id="mItem">${others.sort((a,b)=>a.name.localeCompare(b.name,'fr',{numeric:true})).map(i=>`<option value="${i.id}">${esc(i.name)} (stock ${i.qty})</option>`).join('')}</select>
    <label>Quantité à commander</label><input id="mQty" type="number" inputmode="numeric" min="1" value="1">
    <button class="btn primary block" onclick="manualOk()">Ajouter</button>
    <button class="btn block" onclick="closeSheet()">Annuler</button>`);
}
let extraOrder = {}; // articles ajoutés manuellement
function manualOk(){
  const id = $('mItem').value, n = parseInt($('mQty').value,10) || 0;
  if (n < 1) return toast('Quantité invalide');
  extraOrder[id] = n; closeSheet(); previewMail();
}

/* ============ Mail ============ */
function fill(tpl){ return (tpl||'').replaceAll('{date}', today()).replaceAll('{nom}', S.settings.tech || ''); }
function orderLines(){
  const lines = [];
  lowItems().forEach(it => { if (selection[it.id] > 0) lines.push({it, n:selection[it.id]}); });
  Object.entries(extraOrder).forEach(([id,n]) => { const it = S.items.find(i=>i.id===id); if (it && n>0) lines.push({it, n}); });
  return lines;
}
function buildMail(){
  const st = S.settings;
  const lines = orderLines().map(({it,n}) => `- ${it.name}${it.ref?' (réf. '+it.ref+')':''} : ${n}`);
  const body = `${fill(st.intro)}\n\n${lines.join('\n')}\n\n${fill(st.outro)}`;
  return {subject: fill(st.subject), body};
}
function previewMail(){
  const lines = orderLines();
  if (!lines.length) return toast('Sélectionne au moins un article');
  const st = S.settings; const m = buildMail();
  openSheet(`<h3>Aperçu du mail</h3>
    <div class="sub">À : <b>${esc(st.to || '— non renseigné —')}</b>${st.cc?' · Cc : '+esc(st.cc):''}</div>
    <div class="sub" style="margin-bottom:8px">Objet : <b>${esc(m.subject)}</b></div>
    <div class="preview">${esc(m.body)}</div>
    ${!st.to ? '<div class="hint" style="color:var(--bad)">⚠️ Renseigne l\'adresse de ton responsable dans Réglages.</div>' : ''}
    <button class="btn primary block" onclick="sendMail()">📨 Ouvrir dans ma messagerie</button>
    <button class="btn block" onclick="copyMail()">📋 Copier le texte</button>
    ${Object.keys(extraOrder).length ? '<button class="btn block" onclick="extraOrder={};closeSheet();renderOrder()">Retirer les articles ajoutés à la main</button>' : ''}
    <button class="btn block" onclick="closeSheet()">Annuler</button>`);
}
function sendMail(){
  const st = S.settings, m = buildMail();
  let url = `mailto:${encodeURIComponent(st.to).replace(/%40/g,'@').replace(/%2C/g,',')}?subject=${encodeURIComponent(m.subject)}&body=${encodeURIComponent(m.body)}`;
  if (st.cc) url += `&cc=${encodeURIComponent(st.cc).replace(/%40/g,'@').replace(/%2C/g,',')}`;
  window.location.href = url;
  setTimeout(() => {
    openSheet(`<h3>Mail envoyé ?</h3>
      <div class="sub">Si tu as bien envoyé le mail, je marque ces articles comme « commandés » : ils ne déclencheront plus d'alerte tant qu'ils ne sont pas réapprovisionnés.</div>
      <button class="btn ok block" onclick="markOrdered()">✅ Oui, marquer comme commandés</button>
      <button class="btn block" onclick="closeSheet()">Non, pas encore</button>`);
  }, 800);
}
function markOrdered(){
  const lines = orderLines();
  snapshot();
  lines.forEach(({it}) => it.ordered = true);
  // Commande en attente de réception
  S.orders = S.orders || [];
  S.orders.unshift({id:uid(), t:Date.now(), status:'open',
    lines: lines.map(({it,n}) => ({itemId:it.id, name:it.name, ref:it.ref||'', qty:n, received:0}))});
  S.orders = S.orders.slice(0, 50);
  S.notifs.unshift({id:uid(), t:Date.now(), read:true, msg:`📨 Demande envoyée au responsable : ${lines.map(l=>l.it.name+' ×'+l.n).join(', ')}`});
  selection = {}; extraOrder = {};
  save(); closeSheet(); render(); offerUndo('Commande marquée comme envoyée');
}

/* ============ Annuler la dernière action ============ */
// Une photo des données est prise avant chaque action importante ; « Annuler » la remet en place.
let undoSnap = null, undoTimer = null;
const UNDO_MS = 15000;
function hideUndo(){ undoSnap = null; clearTimeout(undoTimer); $('undoBar').classList.remove('show'); document.body.classList.remove('undo-on'); }
// Hauteur réelle du menu du bas (varie selon le téléphone / l'ordinateur)
function setNavH(){ const n = document.querySelector('nav'); if (n) document.documentElement.style.setProperty('--navh', n.offsetHeight + 'px'); }
window.addEventListener('resize', setNavH);
function snapshot(){
  undoSnap = {data: JSON.stringify(S), sel: JSON.stringify(selection), extra: JSON.stringify(extraOrder)};
}
function offerUndo(msg){
  if (!undoSnap) return;
  $('undoMsg').textContent = msg;
  setNavH();
  $('undoBar').classList.add('show'); document.body.classList.add('undo-on');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(hideUndo, UNDO_MS);
}
function undo(){
  if (!undoSnap) return toast('Rien à annuler');
  S = JSON.parse(undoSnap.data);
  selection = JSON.parse(undoSnap.sel); extraOrder = JSON.parse(undoSnap.extra);
  hideUndo();
  save(); closeSheet(); render(); toast('↩️ Action annulée');
}
// Ctrl+Z sur ordinateur
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && undoSnap && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); undo(); }
});

/* ============ Réception de commande ============ */
const openOrders = () => (S.orders || []).filter(o => o.status === 'open');
const remaining = l => Math.max(0, l.qty - (l.received || 0));
const fmtDay = t => new Date(t).toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'});
function pendingQty(itemId){
  return openOrders().reduce((s, o) => s + o.lines.filter(l => l.itemId === itemId).reduce((a, l) => a + remaining(l), 0), 0);
}
const expandedOrders = {};
function orderCard(o){
  const tot = o.lines.reduce((s,l) => s + l.qty, 0), rest = o.lines.reduce((s,l) => s + remaining(l), 0);
  const partial = rest < tot, open = expandedOrders[o.id], MAX = 5;
  // Articles restant à recevoir d'abord
  const lines = o.lines.slice().sort((a,b) => (!remaining(a)) - (!remaining(b)));
  const shown = open ? lines : lines.slice(0, MAX);
  return `<div class="card">
    <div class="name">Commande du ${fmtDay(o.t)}${partial ? '<span class="tag bad">Partielle</span>' : ''}</div>
    <div class="sub">${o.lines.length} article${o.lines.length>1?'s':''} · ${tot-rest}/${tot} pièce${tot>1?'s':''} reçue${tot>1?'s':''}</div>
    <div class="grid2" style="margin-top:8px">
      <button class="btn primary" onclick="openReception('${o.id}')">📦 Réceptionner</button>
      ${o.lines.every(l => !l.received) ? `<button class="btn" onclick="cancelOrder('${o.id}')">↩️ Annuler la commande</button>`
        : `<button class="btn" onclick="closeOrder('${o.id}')">🗂️ Clôturer</button>`}
    </div>
    <div class="sub" style="margin:10px 0 0;line-height:1.6">${shown.map(l =>
      `${remaining(l) ? '⏳' : '✅'} ${esc(l.name)} : <b>${l.received||0}/${l.qty}</b>`).join('<br>')}</div>
    ${lines.length > MAX ? `<button class="btn block" style="padding:8px" onclick="expandedOrders['${o.id}']=!expandedOrders['${o.id}'];renderOrder()">${open ? '▴ Réduire' : `▾ Voir les ${lines.length - MAX} autres articles`}</button>` : ''}
  </div>`;
}
function openReception(id){
  const o = S.orders.find(x => x.id === id); if (!o) return;
  const nothingYet = o.lines.every(l => !l.received);
  openSheet(`<h3>Réception — commande du ${fmtDay(o.t)}</h3>
    <div class="sub" style="margin-bottom:8px">Coche chaque article reçu. La quantité se remplit toute seule : corrige-la si tu en as reçu moins.</div>
    ${o.lines.map((l,k) => remaining(l) ? `<div class="card row rcvline" id="rcvl${k}">
      <input type="checkbox" class="check rcvchk" id="rcvc${k}" onchange="rcvCheck(${k},${remaining(l)})">
      <label for="rcvc${k}" class="grow" style="margin:0;font-size:inherit;color:inherit;font-weight:normal">
        <div class="name">${esc(l.name)}</div>
        <div class="sub">commandé ${l.qty}${l.received ? ` · déjà reçu ${l.received}` : ''}${S.items.some(i=>i.id===l.itemId) ? '' : ' · article supprimé'}</div>
      </label>
      <input class="smallnum rcv" id="rcv${k}" type="number" inputmode="numeric" min="0" max="${remaining(l)}" value="0" oninput="rcvQty(${k},${remaining(l)})">
    </div>` : '').join('')}
    <button class="btn block" onclick="rcvAll(true)">☑️ Tout cocher (tout est arrivé)</button>
    <button class="btn ok block" id="rcvOk" onclick="applyReception('${id}')">✅ Valider la réception</button>
    <button class="btn block" onclick="closeOrder('${id}')">🗂️ Clôturer sans attendre le reste</button>
    ${nothingYet ? `<button class="btn block" onclick="cancelOrder('${id}')">↩️ Annuler cette commande (envoyée par erreur)</button>` : ''}
    <button class="btn block" onclick="closeSheet()">Fermer</button>`);
  rcvCount();
}
function rcvCheck(k, max){
  const c = $('rcvc'+k), q = $('rcv'+k);
  q.value = c.checked ? (parseInt(q.value,10) > 0 ? q.value : max) : 0;
  rcvCount();
}
function rcvQty(k, max){
  const q = $('rcv'+k); let v = parseInt(q.value,10) || 0;
  if (v > max) { v = max; q.value = max; }
  $('rcvc'+k).checked = v > 0;
  rcvCount();
}
function rcvAll(on){
  document.querySelectorAll('.rcvchk').forEach(c => { c.checked = on; c.dispatchEvent(new Event('change')); });
}
function rcvCount(){
  let n = 0, a = 0;
  document.querySelectorAll('.rcv').forEach(i => { const v = parseInt(i.value,10) || 0; if (v) { n += v; a++; } });
  document.querySelectorAll('.rcvline').forEach(l => l.style.borderColor = l.querySelector('.rcvchk').checked ? 'var(--ok)' : '');
  const b = $('rcvOk'); if (!b) return;
  b.textContent = a ? `✅ Valider : ${a} article${a>1?'s':''} (${n} pièce${n>1?'s':''})` : '✅ Valider la réception';
  b.disabled = !a; b.style.opacity = a ? '' : '.5';
}
function cancelOrder(id){
  const o = S.orders.find(x => x.id === id); if (!o || o.lines.some(l => l.received)) return;
  snapshot();
  S.orders = S.orders.filter(x => x !== o);
  refreshOrdered(o);
  S.notifs.unshift({id:uid(), t:Date.now(), read:true, msg:`↩️ Commande du ${fmtDay(o.t)} annulée`});
  save(); closeSheet(); render();
  offerUndo('Commande annulée');
}
function refreshOrdered(o){
  o.lines.forEach(l => {
    const it = S.items.find(i => i.id === l.itemId); if (!it) return;
    it.ordered = pendingQty(it.id) > 0;
    if (!it.ordered) delete selection[it.id]; // redevient proposé dans « À commander »
  });
}
function applyReception(id){
  const o = S.orders.find(x => x.id === id); if (!o) return;
  if (!document.querySelector('.rcv') || ![...document.querySelectorAll('.rcv')].some(i => parseInt(i.value,10) > 0)) return toast('Coche au moins un article reçu');
  snapshot();
  let n = 0;
  o.lines.forEach((l,k) => {
    const inp = $('rcv' + k); if (!inp) return;
    const q = Math.min(remaining(l), Math.max(0, parseInt(inp.value, 10) || 0));
    if (!q) return;
    l.received = (l.received || 0) + q;
    if (S.items.some(i => i.id === l.itemId)) move(l.itemId, q, `Réception commande du ${fmtDay(o.t)}`, true);
    n += q;
  });
  if (!n) return toast('Aucune quantité saisie');
  const done = o.lines.every(l => !remaining(l));
  if (done) { o.status = 'done'; o.doneAt = Date.now(); }
  refreshOrdered(o);
  S.notifs.unshift({id:uid(), t:Date.now(), read:true,
    msg: done ? `📦 Commande du ${fmtDay(o.t)} entièrement reçue` : `📦 Réception partielle de la commande du ${fmtDay(o.t)} (${n} pièce${n>1?'s':''})`});
  save(); closeSheet(); render();
  offerUndo(done ? 'Commande complète reçue ✓' : `${n} pièce${n>1?'s':''} reçue${n>1?'s':''} — le reste reste en attente`);
}
function closeOrder(id){
  const o = S.orders.find(x => x.id === id); if (!o) return;
  if (!confirm('Clôturer cette commande ? Les quantités non reçues ne seront plus attendues.')) return;
  snapshot();
  o.status = 'closed'; o.doneAt = Date.now();
  refreshOrdered(o);
  S.notifs.unshift({id:uid(), t:Date.now(), read:true, msg:`🗂️ Commande du ${fmtDay(o.t)} clôturée (reste non reçu)`});
  save(); closeSheet(); render(); offerUndo('Commande clôturée');
}
async function copyMail(){
  const m = buildMail(); const txt = `Objet : ${m.subject}\n\n${m.body}`;
  try { await navigator.clipboard.writeText(txt); toast('Texte copié'); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Texte copié'); }
}

/* ============ Historique ============ */
let histFilter = 'all';
function renderHistory(){
  const list = S.history.filter(h => histFilter==='all' || (histFilter==='out'?h.delta<0:h.delta>0)).slice(0,300);
  const now = Date.now(), week = 7*864e5;
  const out7 = S.history.filter(h => h.delta<0 && now-h.t<week).reduce((s,h)=>s-h.delta,0);
  const in7 = S.history.filter(h => h.delta>0 && now-h.t<week).reduce((s,h)=>s+h.delta,0);
  $('view').innerHTML = `
    <div class="grid2" style="margin-bottom:10px">
      <div class="card" style="margin:0;text-align:center"><div class="sub">Retirés (7 j)</div><div class="qty low">${out7}</div></div>
      <div class="card" style="margin:0;text-align:center"><div class="sub">Ajoutés (7 j)</div><div class="qty ok">${in7}</div></div>
    </div>
    <div class="chips">
      ${[['all','Tout'],['out','Retraits'],['in','Ajouts']].map(([k,l])=>`<button class="chip ${histFilter===k?'on':''}" onclick="histFilter='${k}';renderHistory()">${l}</button>`).join('')}
    </div>
    ${list.length ? list.map(h => `<div class="card row hist">
      <div class="grow"><div class="name">${esc(h.name)}</div><div class="sub">${fmtDate(h.t)}${h.note?' · '+esc(h.note):''} · reste ${h.after}</div></div>
      <div class="d ${h.delta>0?'p':'m'}">${h.delta>0?'+':''}${h.delta}</div></div>`).join('') : '<div class="empty">Aucun mouvement.</div>'}`;
}

/* ============ Notifications ============ */
function openNotifs(){
  const list = S.notifs.slice(0,100);
  openSheet(`<h3>Notifications</h3>
    ${list.length ? list.map(n => `<div class="card notif ${n.read?'read':''}"><div>${esc(n.msg)}</div><div class="sub">${fmtDate(n.t)}</div></div>`).join('') : '<div class="empty">Aucune notification.</div>'}
    ${lowItems().some(i=>!i.ordered) ? '<button class="btn primary block" onclick="closeSheet();go(\'order\')">🛒 Voir les articles à commander</button>' : ''}
    ${list.length ? '<button class="btn block" onclick="S.notifs=[];save();closeSheet()">Tout effacer</button>' : ''}
    <button class="btn block" onclick="closeSheet()">Fermer</button>`);
  S.notifs.forEach(n => n.read = true); save();
}

      <button class="btn block" onclick="exportData()">⬇️ Exporter une sauvegarde</button>

      <button class="btn block" onclick="exportXlsx()">📊 Exporter en Excel (.xlsx, mis en forme)</button>
      <button class="btn primary block" onclick="shareInventory()">🔄 Envoyer l'inventaire à jour (OneDrive, Drive, mail…)</button>
      <div class="hint">Toujours le même nom de fichier (inventaire-camion.csv) : dans OneDrive ou Drive, choisis « Remplacer » pour garder un seul fichier à jour.</div>

      <button class="btn block" onclick="$('impCsv').click()">📥 Importer un inventaire</button>
      <input type="file" id="impCsv" accept=".csv,.txt,text/csv,text/plain" hidden onchange="importCSV(this.files[0]);this.value=''">
      <button class="btn block" onclick="downloadTemplate()">📝 Télécharger un modèle vide</button>
    </div>

}
function saveSettings(){
  Object.assign(S.settings, {
    tech:$('sTech').value.trim(), to:$('sTo').value.trim(), cc:$('sCc').value.trim(),
    subject:$('sSubject').value, intro:$('sIntro').value, outro:$('sOutro').value
  });

}
function download(name, content, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function exportData(){ S.lastBackup = Date.now(); save(); render(); download(`stock-camion-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(S,null,2), 'application/json'); }
function exportCSV(){ download(`inventaire-${new Date().toISOString().slice(0,10)}.csv`, inventoryCSV(), 'text/csv'); }
async function shareInventory(){
  const name = 'inventaire-camion.csv';
  try {
    const file = new File([inventoryCSV()], name, {type:'text/csv'});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      await navigator.share({files:[file], title:'Inventaire camion', text:`Inventaire camion au ${today()}`});
      return;

  } catch(e){ if (e.name === 'AbortError') return; }

  toast('Partage indisponible : fichier téléchargé');
}
function inventoryCSV(){
  const rows = [['Désignation','Référence','Catégorie','Stock','Seuil','Cible','Statut']]
    .concat(S.items.slice()
      .map(i => [i.name,i.ref,i.cat,i.qty,i.min,i.target,i.ordered?'Commandé':(isLow(i)?'À commander':'OK')]));
  return'\ufeff'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
}
/* ============ Import inventaire CSV ============ */
function downloadTemplate(){
  const rows = [['Désignation','Référence','Catégorie','Stock','Seuil','Cible'],
    ['Détecteur de mouvement','DET-200','Détection','6','2','8'],
    ['Batterie 12V 7Ah','BAT-127','Alimentation','4','2','6']];
  download('modele-inventaire.csv', '\ufeff'+rows.map(r=>r.map(c=>`"${c}"`).join(';')).join('\n'), 'text/csv');
}
function parseCSV(text){
  text = text.replace(/^\ufeff/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const count = ch => first.split(ch).length;
  const sep = [';', '\t', ','].sort((a,b) => count(b) - count(a))[0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i+1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(c => c));
}
let pendingImport = null;
function importCSV(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    // Excel enregistre souvent en encodage Windows : on essaie UTF-8, sinon Windows-1252
    let text;
    try { text = new TextDecoder('utf-8', {fatal: true}).decode(r.result); }
    catch(e) { text = new TextDecoder('windows-1252').decode(r.result); }
    const rows = parseCSV(text);
    if (!rows.length) return toast('Fichier vide');
    // Détection des colonnes par l'en-tête
    const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const h = rows[0].map(norm);
    const find = keys => h.findIndex(c => keys.some(k => c.includes(k)));
    let map = { name: find(['design','nom','article','libelle','produit']), ref: find(['ref','code']),
                cat: find(['categ','famille','type']), qty: find(['stock','quantit','qte','qty']),
                min: find(['seuil','min','alerte']), target: find(['cible','max','objectif']) };
    let data = rows;
    if (map.name >= 0) data = rows.slice(1);           // en-tête reconnu
    else map = {name:0, ref:1, cat:2, qty:3, min:4, target:5}; // sinon ordre par défaut
    const num = v => { const n = parseInt(String(v ?? '').replace(/\s/g,''), 10); return isNaN(n) ? null : Math.max(0, n); };
    const get = (r, k) => map[k] >= 0 ? r[map[k]] : undefined;
    const items = [], skipped = [];
    data.forEach((r, i) => {
      const name = (get(r,'name') || '').trim();
      if (!name) { skipped.push(i + 2); return; }
      items.push({ name, ref:(get(r,'ref')||'').trim(), cat:(get(r,'cat')||'').trim(),
        qty:num(get(r,'qty')), min:num(get(r,'min')), target:num(get(r,'target')) });
    });
    if (!items.length) return toast('Aucun article trouvé dans le fichier');
    pendingImport = items;
    openSheet(`<h3>Importer l'inventaire</h3>
      <div class="sub"><b>${items.length}</b> article${items.length>1?'s':''} trouvé${items.length>1?'s':''} dans « ${esc(file.name)} »${skipped.length?` · ${skipped.length} ligne(s) sans désignation ignorée(s)`:''}.</div>
      <div class="preview" style="margin-top:8px">${items.slice(0,8).map(i=>esc(`${i.name}${i.ref?' ('+i.ref+')':''} : ${i.qty ?? '–'}`)).join('\n')}${items.length>8?'\n…':''}</div>
      <button class="btn primary block" onclick="applyImport('merge')">🔄 Fusionner avec mon stock</button>
      <div class="hint">Met à jour les articles existants (même référence, ou même nom si pas de référence) et ajoute les nouveaux. Rien n'est supprimé.</div>
      <button class="btn danger block" onclick="applyImport('replace')">♻️ Remplacer tout mon stock</button>
      <div class="hint">Supprime les articles actuels et les remplace par ceux du fichier. L'historique est conservé.</div>
      <button class="btn block" onclick="pendingImport=null;closeSheet()">Annuler</button>`);
  };
  r.readAsArrayBuffer(file);
}
function applyImport(mode){
  const items = pendingImport; if (!items) return;
  if (mode === 'replace' && !confirm('Remplacer tout le stock actuel par ce fichier ?')) return;
  snapshot();
  if (mode === 'replace') S.items = [];
  let added = 0, updated = 0;
  const key = s => (s||'').trim().toLowerCase();
  items.forEach(n => {
    const ex = S.items.find(i => (n.ref && key(i.ref) === key(n.ref)) || (!n.ref && key(i.name) === key(n.name)));
    if (ex) {
      const before = ex.qty;
      ex.name = n.name; if (n.ref) ex.ref = n.ref; if (n.cat) ex.cat = n.cat;
      if (n.min !== null) ex.min = n.min;
      if (n.target !== null) ex.target = n.target;
      if (n.qty !== null && n.qty !== before) {
        ex.qty = n.qty;
        S.history.unshift({id:uid(), t:Date.now(), itemId:ex.id, name:ex.name, delta:n.qty-before, after:n.qty, note:'Import inventaire'});
        checkThreshold(ex, before);
      }
      updated++;
    } else {
      const it = {id:uid(), ordered:false, name:n.name, ref:n.ref, cat:n.cat||'Divers',
        qty:n.qty ?? 0, min:n.min ?? 1, target:n.target ?? ''};
      S.items.push(it); if (isLow(it)) checkThreshold(it, it.min + 1);
      added++;
    }
  });
  pendingImport = null; save(); closeSheet(); render();
  offerUndo(`Import : ${added} ajouté(s), ${updated} mis à jour`);
}


/* ============ OneDrive (compte Microsoft personnel) ============ */
// L'appli n'a accès qu'à SON dossier : OneDrive › Applications › <nom de l'appli>.
// Après chaque modification, elle y envoie stock-camion.json, stock-camion.csv et stock-camion.xlsx.
const OD_SCOPES = ['Files.ReadWrite.AppFolder'];
const OD_KEY = 'stockCamion_onedrive';
const GRAPH = 'https://graph.microsoft.com/v1.0/me/drive/special/approot';
const OD = {app: null, account: null, busy: false, again: false, timer: null, state: 'off', msg: '', folderUrl: ''};
let odMeta = (() => { try { return JSON.parse(localStorage.getItem(OD_KEY)) || {}; } catch(e){ return {}; } })();
// odMeta : {pending, last, auto, err}
if (odMeta.auto === undefined) odMeta.auto = true;
function odSaveMeta(){ try { localStorage.setItem(OD_KEY, JSON.stringify(odMeta)); } catch(e){} }
const odClientId = () => (S.settings.odClientId || '').trim();
const odReady = () => !!(OD.app && OD.account);
const odRedirect = () => location.origin + location.pathname.replace(/index\.html$/, '');

async function odInit(){
  odUi();
  if (!window.msal || !odClientId()) return;
  if (!/^[0-9a-f-]{36}$/i.test(odClientId())) { odSet('err', 'Identifiant d\'application invalide.'); return; }
  if (!location.protocol.startsWith('http')) { odSet('err', 'La connexion OneDrive ne marche que depuis l\'adresse en ligne de l\'appli (github.io).'); return; }
  try {
    OD.app = new msal.PublicClientApplication({
      auth: {clientId: odClientId(), authority: 'https://login.microsoftonline.com/consumers', redirectUri: odRedirect()},
      cache: {cacheLocation: 'localStorage'}
    });
    await OD.app.initialize();
    const r = await OD.app.handleRedirectPromise();
    if (r && r.account) { OD.app.setActiveAccount(r.account); toast('✅ Connecté à OneDrive'); odMeta.pending = true; odSaveMeta(); }
    const acc = OD.app.getActiveAccount() || OD.app.getAllAccounts()[0];
    if (acc) { OD.app.setActiveAccount(acc); OD.account = acc; }
    if (location.hash.includes('code=') || location.hash.includes('error=')) history.replaceState(null, '', location.pathname + location.search);
  } catch(e) {
    odSet('err', 'Connexion impossible : ' + odErrText(e));
    return;
  }
  if (odReady()) { odSet(odMeta.pending ? 'wait' : 'ok'); if (odMeta.pending && odMeta.auto) odSchedule(800); }
  else odSet('off');
}
function odErrText(e){
  const m = (e && (e.errorMessage || e.message || e.errorCode)) || String(e);
  if (/AADSTS700016|application.*not found/i.test(m)) return 'identifiant d\'application inconnu chez Microsoft (vérifie le copier-coller).';
  if (/AADSTS50011|redirect/i.test(m)) return 'adresse de retour incorrecte dans la déclaration Microsoft (doit être ' + odRedirect() + ').';
  if (/AADSTS9002326|cross-origin|Single-Page/i.test(m)) return 'la plateforme doit être « Application monopage (SPA) » dans la déclaration Microsoft.';
  if (/user_cancelled|access_denied|consent/i.test(m)) return 'connexion annulée.';
  return m.slice(0, 160);
}
function odLogin(){
  if (!OD.app) return toast('Enregistre d\'abord l\'identifiant de l\'application');
  odSaveMeta();
  OD.app.loginRedirect({scopes: OD_SCOPES, prompt: 'select_account'}).catch(e => odSet('err', odErrText(e)));
}
async function odLogout(){
  if (!confirm('Déconnecter OneDrive ? Tes fichiers déjà envoyés restent sur ton OneDrive.')) return;
  try { if (OD.app && OD.account) await OD.app.clearCache({account: OD.account}); } catch(e){}
  OD.account = null; odMeta = {auto: odMeta.auto}; odSaveMeta(); odSet('off'); render();
}
async function odToken(){
  try { return (await OD.app.acquireTokenSilent({scopes: OD_SCOPES, account: OD.account})).accessToken; }
  catch(e) {
    if (e instanceof msal.InteractionRequiredAuthError) { odSet('err', 'Session expirée : appuie sur « Se reconnecter ».', true); }
    throw e;
  }
}
function odSet(state, msg, needLogin){
  OD.state = state; OD.msg = msg || ''; OD.needLogin = !!needLogin;
  odMeta.err = state === 'err' ? OD.msg : ''; odSaveMeta(); odUi();
}
function odUi(){
  const b = $('odBadge'), d = $('odDot');
  if (b) { b.hidden = !odClientId(); d.className = 'oddot ' + ({ok:'ok', wait:'wait', busy:'wait', err:'err'}[OD.state] || ''); }
  if ($('odCard')) $('odCard').innerHTML = odSettingsHtml();
}
function odDirty(){
  if (!odClientId()) return;
  odMeta.pending = true; odSaveMeta();
  if (odReady() && odMeta.auto) { if (OD.state !== 'busy') odSet('wait'); odSchedule(4000); }
}
function odSchedule(ms){ clearTimeout(OD.timer); OD.timer = setTimeout(() => odSync(), ms); }
async function odPut(token, name, body, type){
  const r = await fetch(`${GRAPH}:/${encodeURIComponent(name)}:/content`, {method: 'PUT', headers: {Authorization: 'Bearer ' + token, 'Content-Type': type}, body});
  if (!r.ok) { const t = await r.text().catch(() => ''); throw new Error(`OneDrive a refusé ${name} (${r.status}) ${t.slice(0, 120)}`); }
  return r.json();
}
async function odSync(manual){
  if (!odReady()) return manual && toast('Connecte d\'abord OneDrive');
  if (OD.busy) { OD.again = true; return; }
  if (!navigator.onLine) { odSet('wait', 'Hors ligne : envoi dès le retour du réseau.'); return manual && toast('Hors ligne : envoi dès le retour du réseau'); }
  OD.busy = true; OD.again = false; odSet('busy', 'Envoi en cours…');
  try {
    const token = await odToken();
    if (!S.items.length) {
      const remote = await odRemoteData(token);
      if (remote && remote.items && remote.items.length) {
        odMeta.pending = false; odSaveMeta();
        odSet('err', `Ce téléphone est vide alors que ton OneDrive contient ${remote.items.length} articles : rien n'a été envoyé. Appuie sur « Récupérer mes données depuis OneDrive ».`);
        return;
      }
    }
    const data = JSON.stringify(Object.assign({}, S, {exportedAt: new Date().toISOString()}), null, 1);
    const xlsx = XlsxLite.stockWorkbook(sortedForExport(), S.history, {date: new Date().toLocaleString('fr-FR'), pending: it => pendingQty(it.id)});
    await odPut(token, 'stock-camion.json', data, 'application/json');
    await odPut(token, 'stock-camion.csv', inventoryCSV(), 'text/csv');
    const x = await odPut(token, 'stock-camion.xlsx', xlsx, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    if (x && x.parentReference) OD.folderUrl = '';
    odMeta.pending = OD.again; odMeta.last = Date.now(); odSaveMeta();
    odSet(OD.again ? 'wait' : 'ok');
    if (manual) toast('☁️ OneDrive à jour');
  } catch(e) {
    odMeta.pending = true; odSaveMeta(); // sera renvoyé au prochain essai
    if (OD.state !== 'err' || !OD.needLogin) odSet('err', !navigator.onLine ? 'Hors ligne : envoi dès le retour du réseau.' : odErrText(e), OD.needLogin);
    if (!OD.needLogin) odSchedule(60000); // nouvel essai dans 1 min
  } finally {
    OD.busy = false;
    if (OD.again && odMeta.auto) odSchedule(1500);
  }
}
async function odRemoteData(token){
  const r = await fetch(`${GRAPH}:/stock-camion.json`, {headers: {Authorization: 'Bearer ' + token}});
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('OneDrive ' + r.status);
  const meta = await r.json();
  const d = await (await fetch(meta['@microsoft.graph.downloadUrl'])).json();
  d.__modified = meta.lastModifiedDateTime;
  return d;
}
async function odRestore(){
  if (!odReady()) return toast('Connecte d\'abord OneDrive');
  try {
    const token = await odToken();
    const d = await odRemoteData(token);
    if (!d) return toast('Aucune sauvegarde trouvée sur OneDrive');
    if (!Array.isArray(d.items)) throw new Error('fichier invalide');
    const when = d.exportedAt ? new Date(d.exportedAt).toLocaleString('fr-FR') : fmtDate(Date.parse(d.__modified));
    if (!d.items.length) return alert(`La sauvegarde OneDrive du ${when} est VIDE (0 article) : rien n'a été remplacé.\n\nPour remettre ton stock : Réglages → Importer un inventaire (fichier CSV) ou Importer une sauvegarde (fichier .json).`);
    if (!confirm(`Remplacer les données de ce téléphone (${S.items.length} articles) par la sauvegarde OneDrive du ${when} (${d.items.length} articles) ?`)) return;
    snapshot();
    delete d.exportedAt; delete d.__modified;
    S = Object.assign(defaults(), d); save(); render(); offerUndo('Données récupérées depuis OneDrive');
  } catch(e) { toast('Récupération impossible : ' + odErrText(e)); }
}
async function odOpenFolder(){
  try {
    const token = await odToken();
    const r = await fetch(GRAPH, {headers: {Authorization: 'Bearer ' + token}});
    const j = await r.json();
    if (j.webUrl) window.open(j.webUrl, '_blank'); else throw new Error('dossier introuvable');
  } catch(e) { toast('Impossible d\'ouvrir le dossier : ' + odErrText(e)); }
}
function odSaveClientId(){
  const v = ($('odClient').value || '').trim();
  if (v && !/^[0-9a-f-]{36}$/i.test(v)) return toast('Identifiant invalide : il ressemble à 1a2b3c4d-…-…');
  S.settings.odClientId = v; save(); OD.app = null; OD.account = null; odInit(); toast(v ? 'Identifiant enregistré' : 'Identifiant effacé');
}
function odToggleAuto(on){ odMeta.auto = on; odSaveMeta(); if (on) odDirty(); odUi(); }
function odSettingsHtml(){
  const cid = odClientId();
  const dot = s => `<span class="oddot ${s}" style="position:static;display:inline-block;border-color:var(--card)"></span>`;
  if (!cid) return `
    <div class="sub">Envoie automatiquement ton stock (Excel, CSV et sauvegarde) sur <b>ton OneDrive personnel</b> après chaque modification. L'appli n'a accès qu'à un seul dossier : <b>Applications › Stock Camion</b>.</div>
    <label>Identifiant de l'application (Client ID)</label>
    <input id="odClient" placeholder="ex. 1a2b3c4d-5e6f-7a8b-9c0d-112233445566" autocomplete="off">
    <button class="btn primary block" onclick="odSaveClientId()">Enregistrer l'identifiant</button>
    <div class="hint">Cet identifiant s'obtient une seule fois en déclarant l'appli chez Microsoft (gratuit).</div>`;
  if (!odReady()) return `
    <div class="odstat">${dot(OD.state === 'err' ? 'err' : '')} <span>${OD.state === 'err' ? esc(OD.msg) : 'Non connecté'}</span></div>
    <button class="btn primary block" onclick="odLogin()">🔑 Se connecter à mon compte Microsoft</button>
    <div class="hint">Une page Microsoft s'ouvre : connecte-toi avec ton compte <b>personnel</b> (outlook / hotmail) et accepte l'accès au dossier de l'appli.</div>
    <details style="margin-top:10px"><summary class="sub">Identifiant de l'application</summary>
      <input id="odClient" value="${esc(cid)}" style="margin-top:6px"><button class="btn block" onclick="odSaveClientId()">Modifier</button></details>`;
  const st = {ok: ['ok', 'À jour'], wait: ['wait', 'Modifications en attente d\'envoi'], busy: ['wait', 'Envoi en cours…'], err: ['err', OD.msg], off: ['', '']}[OD.state] || ['', ''];
  return `
    <div class="odstat">${dot(st[0])} <b>${esc(st[1] || '')}</b></div>
    ${OD.state === 'wait' && OD.msg ? `<div class="sub">${esc(OD.msg)}</div>` : ''}
    <div class="sub">Compte : <b>${esc(OD.account.username || '')}</b><br>Dernier envoi : <b>${odMeta.last ? fmtDate(odMeta.last) : 'jamais'}</b></div>
    <label style="display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px;color:var(--text)">
      <input type="checkbox" class="check" ${odMeta.auto ? 'checked' : ''} onchange="odToggleAuto(this.checked)"> Envoi automatique après chaque modification</label>
    ${OD.needLogin ? `<button class="btn primary block" onclick="odLogin()">🔑 Se reconnecter</button>` : ''}
    <button class="btn block" onclick="odSync(true)">🔄 Synchroniser maintenant</button>
    <button class="btn block" onclick="odOpenFolder()">📂 Ouvrir le dossier OneDrive</button>
    <button class="btn block" onclick="odRestore()">📥 Récupérer mes données depuis OneDrive</button>
    <div class="hint">Fichiers envoyés : <b>stock-camion.xlsx</b> (Excel mis en forme + historique), <b>stock-camion.csv</b> et <b>stock-camion.json</b> (sauvegarde complète). L'appli reste la référence : une modification faite dans l'Excel sur OneDrive sera remplacée au prochain envoi.</div>
    <button class="btn block" onclick="odLogout()">Déconnecter OneDrive</button>`;
}
window.addEventListener('online', () => { if (odReady() && odMeta.pending && odMeta.auto) odSchedule(1500); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && odReady() && odMeta.pending && odMeta.auto) odSchedule(1500); });

function sortedForExport(){ return S.items.slice(); } // même ordre que ton inventaire
function exportXlsx(){
  const x = XlsxLite.stockWorkbook(sortedForExport(), S.history, {date: new Date().toLocaleString('fr-FR'), pending: it => pendingQty(it.id)});
  download(`stock-camion-${new Date().toISOString().slice(0,10)}.xlsx`, x, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

function importData(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try { const d = JSON.parse(r.result); if (!Array.isArray(d.items)) throw 0;
      if (!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')) return;
      snapshot(); S = Object.assign(defaults(), d); save(); render(); offerUndo('Sauvegarde importée'); }
    catch(e){ toast('Fichier de sauvegarde invalide'); }
  };
  r.readAsText(file);
}
function resetAll(){
  if (!confirm('Effacer tout le stock, l\'historique et les réglages ?')) return;
  S = defaults(); save(); render(); toast('Données effacées');
}

render();
odInit();

/* ============ Appli installable / hors ligne ============ */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
