<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Batteries VE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Batteries VE</title>
<style>
:root{
  --bg:#f2f5f6;--card:#fff;--text:#16212a;--muted:#667684;--line:#dfe6ea;
  --primary:#0f4c5c;--primary-2:#1b6f85;--ok:#1f9d55;--warn:#d98a00;--bad:#d64545;
  --chip:#eaf1f3;--shadow:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0e1418;--card:#172128;--text:#e6eef2;--muted:#8b9ba6;--line:#26343d;
  --primary:#3aa0b8;--primary-2:#5bbbd2;--chip:#20303a;--shadow:none;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:10;background:var(--primary);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{position:relative;background:none;border:0;color:#fff;font-size:22px;padding:4px 8px}
.back{font-size:26px;line-height:1;padding:0 6px 2px 0}
.badge{position:absolute;top:-2px;right:0;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:10px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
.oddot{position:absolute;right:4px;bottom:6px;width:10px;height:10px;border-radius:50%;border:2px solid var(--primary);background:#9aa5b1}
.oddot.ok{background:#2ecc71}.oddot.wait{background:#ffc107}.oddot.err{background:#e74c3c}
main{padding:12px 16px calc(90px + env(safe-area-inset-bottom));max-width:700px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:9px 0 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button span.i{font-size:21px}
nav button.active{color:var(--primary)}
nav .badge{top:4px;right:calc(50% - 22px)}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line);padding:12px;margin-bottom:10px}
.tap{cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.name{font-weight:600}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;background:var(--chip);color:var(--text)}
.btn.primary{background:var(--primary);color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.block{width:100%;margin-top:8px}
.btn.small{padding:7px 10px;font-size:13px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:16px;font-family:inherit}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
h2{font-size:17px;margin:14px 0 10px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:16px;padding:7px 12px;font-size:14px;font-weight:600}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px;margin:4px 4px 0 0}
.pill.ok{background:#e3f4ea;color:#17703f}.pill.warn{background:#fff1d6;color:#8a5a00}.pill.bad{background:#fde8e8;color:var(--bad)}.pill.info{background:#e3eef2;color:var(--primary-2)}
@media (prefers-color-scheme: dark){.pill.ok{background:#173a26;color:#7fd8a1}.pill.warn{background:#3a2c10;color:#f3c66b}.pill.bad{background:#3a1d1d;color:#ff8f8f}.pill.info{background:#1d2f38;color:#8fd0e2}}
.meas{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:14px}
.meas span{background:var(--chip);border-radius:8px;padding:4px 8px}
.bat{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.unit{display:flex;gap:4px}
.unit .chip{padding:7px 10px}
.preview{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:52vh;overflow:auto}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.center{text-align:center}
.prog{height:6px;background:var(--chip);border-radius:4px;overflow:hidden;margin-top:8px}
.prog>div{height:100%;background:var(--ok)}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:30px;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:9}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:700px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.undobar{position:fixed;left:12px;right:12px;bottom:calc(var(--navh,60px) + 8px);max-width:676px;margin:0 auto;background:#222;color:#fff;border-radius:12px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;z-index:31;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3);transform:translateY(20px);opacity:0;visibility:hidden;pointer-events:none;transition:transform .25s,opacity .25s,visibility .25s}
.undobar.show{transform:none;opacity:1;visibility:visible;pointer-events:auto}
.undobar span{flex:1}
.undobar button{border:0;border-radius:8px;background:#ffc107;color:#222;font-weight:700;font-size:14px;padding:9px 12px}
body.undo-on main{padding-bottom:calc(var(--navh,60px) + 90px + env(safe-area-inset-bottom))}
body.undo-on .fab{bottom:calc(var(--navh,60px) + 76px)}
body.undo-on .toast{bottom:calc(var(--navh,60px) + 130px)}
.alertbar{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;display:flex;align-items:center;gap:8px;background:#fff4e0;color:#8a5a00;border:1px solid #f1d39a}
.alertbar.bad{background:#fde8e8;color:var(--bad);border-color:#f3b4b4}
@media (prefers-color-scheme: dark){.alertbar{background:#3a2c10;color:#f3c66b;border-color:#5a4418}.alertbar.bad{background:#3a1d1d;color:#ff8f8f;border-color:#5a2a2a}}
.odstat{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}
.check{width:24px;height:24px;flex:none;accent-color:var(--primary)}
</style>
</head>
<body>

<header>
  <button class="hbtn back" id="backBtn" onclick="go('ves')" hidden aria-label="Retour">‹</button>
  <h1 id="title">🔋 Batteries VE</h1>
  <button class="hbtn" id="odBadge" onclick="go('settings')" aria-label="OneDrive" hidden>☁️<span class="oddot" id="odDot"></span></button>
</header>

<main id="view"></main>
<button class="fab" id="fab" onclick="fabAction()" aria-label="Ajouter">+</button>

<nav>
  <button data-tab="ves" class="active" onclick="go('ves')"><span class="i">📋</span>VE</button>
  <button data-tab="bats" onclick="go('bats')"><span class="i">🔋</span>Batteries<span class="badge" id="batBadge" hidden>0</span></button>
  <button data-tab="settings" onclick="go('settings')"><span class="i">⚙️</span>Réglages</button>
</nav>

<div class="sheet-bg" id="sheetBg" onclick="if(event.target===this){closeSheet();render()}"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="undobar" id="undoBar"><span id="undoMsg"></span><button onclick="undo()">↩️ Annuler</button></div>
<input type="file" id="impJson" accept=".json,application/json" hidden onchange="importData(this.files[0]);this.value=''">

<script src="msal-browser.min.js"></script>
<script src="xlsx-lite.js"></script>
<script src="jspdf.umd.min.js"></script>
<script src="jspdf.plugin.autotable.min.js"></script>
<script>
/* ============ Version ============ */
const APP_VERSION = '1.2';
const APP_DATE = '12/10/2026';

/* ============ Données ============ */
const KEY = 'batteriesVE_v1';
const CAPS = [7, 17, 18, 24, 36];
const defaults = () => ({
  sites: [],      // {id, name}
  ves: [],        // {id, siteId, start, end, closed, coffrets:[...], carnet, carnetEdited}
  settings: {ageYears: 4, warnMonths: 6, tech: '', odClientId: '850f4eca-b80e-4b18-aa2a-33d7855f04bf'}, // appli « BATTERIES VE » chez Microsoft (non secret)
  lastBackup: 0
});
function load(){
  try {
    const s = localStorage.getItem(KEY);
    if (s) { const d = defaults(), saved = JSON.parse(s), st = Object.assign({}, d.settings, saved.settings || {}); if (!st.odClientId) st.odClientId = d.settings.odClientId; return Object.assign(d, saved, {settings: st}); }
  } catch(e){}
  return defaults();
}
let S = load();
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  updateBadges();
  try { odDirty(); } catch(e){}
}
let storageOK = true;
try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); } catch(e){ storageOK = false; }
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}

/* ============ Utilitaires ============ */
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDay = t => t ? new Date(t).toLocaleDateString('fr-FR') : '';
const fmtDate = t => new Date(t).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const dayInput = t => { const d = new Date(t); return new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const thisMonth = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); };
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.').replace(/\s/g,'')); return isNaN(n) ? null : n; };
const fmtNum = v => v === null || v === '' || v === undefined ? '' : String(v).replace('.', ',');
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2400); }
const siteName = id => (S.sites.find(s => s.id === id) || {name:'Site inconnu'}).name;
const typeLabel = t => t === 'ca' ? 'Contrôle d\'accès' : 'Alarme';
const typeIcon = t => t === 'ca' ? '🚪' : '🚨';

/* ============ Âge des batteries ============ */
function ageMonths(pose){
  if (!pose) return null;
  const [y, m] = pose.split('-').map(Number); if (!y || !m) return null;
  const d = new Date(); return (d.getFullYear() - y) * 12 + (d.getMonth() + 1 - m);
}
function ageText(mo){
  if (mo === null) return 'date de pose inconnue';
  if (mo < 0) return 'date future';
  const y = Math.floor(mo / 12), m = mo % 12;
  return (y ? y + ' an' + (y > 1 ? 's' : '') : '') + (y && m ? ' ' : '') + (m || !y ? m + ' mois' : '');
}
function batStatus(b){ // 'bad' | 'warn' | 'ok' | 'unknown'
  const mo = ageMonths(b.pose); if (mo === null) return 'unknown';
  const lim = (+S.settings.ageYears || 4) * 12, warn = +S.settings.warnMonths || 6;
  return mo >= lim ? 'bad' : (mo >= lim - warn ? 'warn' : 'ok');
}
const fmtPose = p => p ? p.split('-').reverse().join('/') : '—';
function batPill(b){
  const st = batStatus(b);
  const lab = {bad: '⚠️ à remplacer', warn: '⏳ à prévoir', ok: '✓', unknown: '? date'}[st];
  return `<span class="pill ${st === 'unknown' ? 'info' : st}">12V ${b.cap}Ah · ${fmtPose(b.pose)} · ${b.pose ? ageText(ageMonths(b.pose)) : ''} ${lab}</span>`;
}

/* ============ Navigation ============ */
let tab = 'ves', curVe = null;
function go(t, veId){
  tab = t; curVe = veId || null;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === (t === 've' ? 'ves' : t)));
  render(); window.scrollTo(0,0);
}
function render(){
  const ve = curVe && S.ves.find(v => v.id === curVe);
  if (tab === 've' && !ve) tab = 'ves';
  $('backBtn').hidden = tab !== 've';
  $('title').textContent = tab === 've' ? siteName(ve.siteId) : '🔋 Batteries VE';
  $('fab').style.display = (tab === 'ves' || tab === 've') ? '' : 'none';
  ({ves: renderVes, ve: () => renderVe(ve), bats: renderBats, settings: renderSettings})[tab]();
  updateBadges(); odUi();
}
function fabAction(){ tab === 've' ? addCoffret() : newVe(); }

/* ============ Liste des VE ============ */
function veProgress(ve){
  const n = ve.coffrets.length, d = ve.coffrets.filter(c => coffretDone(c)).length;
  return {n, d};
}
const coffretDone = c => num(c.vOn) !== null && num(c.vOff) !== null && num(c.conso) !== null;
function veCard(ve){
  const {n, d} = veProgress(ve);
  const bad = ve.coffrets.reduce((s, c) => s + c.bats.filter(b => batStatus(b) === 'bad').length, 0);
  return `<div class="card tap" onclick="go('ve','${ve.id}')">
    <div class="row"><div class="grow">
      <div class="name">${ve.closed ? '✅' : '🟢'} ${esc(siteName(ve.siteId))}</div>
      <div class="sub">${ve.closed ? `Du ${fmtDay(ve.start)} au ${fmtDay(ve.end)}` : `En cours depuis le ${fmtDay(ve.start)}`} · ${n} coffret${n>1?'s':''}${bad ? ` · <b style="color:var(--bad)">${bad} batterie${bad>1?'s':''} à remplacer</b>` : ''}</div>
    </div><div style="font-size:22px;color:var(--muted)">›</div></div>
    ${!ve.closed && n ? `<div class="prog"><div style="width:${Math.round(d/n*100)}%"></div></div><div class="sub">${d}/${n} coffret${n>1?'s':''} relevé${d>1?'s':''}</div>` : ''}
  </div>`;
}
function renderVes(){
  const open = S.ves.filter(v => !v.closed).sort((a,b) => b.start - a.start);
  const closed = S.ves.filter(v => v.closed).sort((a,b) => (b.end||b.start) - (a.end||a.start));
  const alerts = allBatteries().filter(x => x.st === 'bad').length;
  $('view').innerHTML = `
    ${!storageOK ? `<div class="alertbar bad">⛔ Les données ne sont pas enregistrées sur ce navigateur. Ouvre l'appli avec Chrome.</div>` : ''}
    ${alerts ? `<div class="alertbar bad tap" onclick="go('bats')">⚠️ <div class="grow"><b>${alerts} batterie${alerts>1?'s':''}</b> de plus de ${S.settings.ageYears} ans à remplacer</div>›</div>` : ''}
    <h2>VE en cours</h2>
    ${open.length ? open.map(veCard).join('') : `<div class="card empty">Aucune VE en cours.<br><button class="btn primary block" onclick="newVe()">+ Démarrer une VE</button></div>`}
    ${closed.length ? `<h2>Historique</h2>${closed.slice(0, 40).map(veCard).join('')}` : ''}`;
}

/* ============ Nouvelle VE ============ */
function newVe(){
  openSheet(`<h3>Nouvelle VE</h3>
    <label>Site</label>
    <input id="nvSite" list="siteList" placeholder="ex. Résidence Les Tilleuls" autocomplete="off">
    <datalist id="siteList">${S.sites.slice().sort((a,b)=>a.name.localeCompare(b.name,'fr')).map(s => `<option value="${esc(s.name)}">`).join('')}</datalist>
    <div class="hint">Si le site existe déjà, ses coffrets et batteries sont repris automatiquement : il ne reste qu'à saisir les mesures.</div>
    <label>Date de début</label>
    <input id="nvDate" type="date" value="${dayInput(Date.now())}">
    <button class="btn primary block" onclick="createVe()">Démarrer la VE</button>
    <button class="btn block" onclick="closeSheet()">Annuler</button>`);
  setTimeout(() => $('nvSite') && $('nvSite').focus(), 60);
}
function createVe(){
  const name = $('nvSite').value.trim(); if (!name) return toast('Indique le nom du site');
  let site = S.sites.find(s => s.name.toLowerCase() === name.toLowerCase());
  if (!site) { site = {id: uid(), name}; S.sites.push(site); }
  const start = $('nvDate').value ? new Date($('nvDate').value + 'T08:00').getTime() : Date.now();
  // Reprise de la dernière VE du site
  const prev = S.ves.filter(v => v.siteId === site.id).sort((a,b) => b.start - a.start)[0];
  const coffrets = prev ? prev.coffrets.map(c => ({id: uid(), label: c.label, loc: c.loc, type: c.type,
    bats: c.bats.map(b => ({id: uid(), cap: b.cap, pose: b.pose, replaced: false})), vOn: '', vOff: '', conso: '', unit: c.unit || 'mA', note: ''})) : [];
  const ve = {id: uid(), siteId: site.id, start, end: null, closed: false, coffrets, carnet: '', carnetEdited: false};
  S.ves.push(ve); save(); closeSheet(); go('ve', ve.id);
  toast(prev ? `${coffrets.length} coffret${coffrets.length>1?'s':''} repris de la VE du ${fmtDay(prev.start)}` : 'VE démarrée : ajoute tes coffrets avec +');
}

/* ============ Détail d'une VE ============ */
function coffretCard(ve, c, i){
  const done = coffretDone(c);
  return `<div class="card tap" onclick="editCoffret('${c.id}')">
    <div class="row"><div class="grow">
      <div class="name">${typeIcon(c.type)} ${esc(c.label || 'Coffret ' + (i+1))} ${done ? '<span class="pill ok">relevé ✓</span>' : '<span class="pill warn">à relever</span>'}</div>
      <div class="sub">${typeLabel(c.type)}${c.loc ? ' · ' + esc(c.loc) : ''}</div>
    </div><div style="font-size:22px;color:var(--muted)">›</div></div>
    <div>${c.bats.length ? c.bats.map(b => batPill(b) + (b.replaced ? '<span class="pill info">🔁 remplacée</span>' : '')).join('') : '<span class="pill info">aucune batterie</span>'}</div>
    ${done || c.vOn || c.vOff || c.conso ? `<div class="meas"><span>⚡ ${fmtNum(c.vOn) || '–'} V</span><span>🔌 ${fmtNum(c.vOff) || '–'} V</span><span>➰ ${fmtNum(c.conso) || '–'} ${c.unit}</span></div>` : ''}
    ${c.note ? `<div class="sub">📝 ${esc(c.note)}</div>` : ''}
  </div>`;
}
function renderVe(ve){
  const {n, d} = veProgress(ve);
  $('view').innerHTML = `
    <div class="card">
      <div class="sub">${ve.closed ? `✅ Clôturée · du ${fmtDay(ve.start)} au ${fmtDay(ve.end)}` : `🟢 En cours depuis le ${fmtDay(ve.start)}`}</div>
      ${n ? `<div class="prog"><div style="width:${Math.round(d/n*100)}%"></div></div><div class="sub">${d}/${n} coffret${n>1?'s':''} relevé${d>1?'s':''}</div>` : ''}
      <div class="grid2" style="margin-top:6px">
        <button class="btn" onclick="showRecap('${ve.id}')">📋 Récap</button>
        <button class="btn" onclick="showCarnet('${ve.id}')">📒 Carnet</button>
      </div>
      <button class="btn primary block" onclick="makePdf('${ve.id}')">📄 Rapport PDF</button>
    </div>
    <h2>Coffrets</h2>
    ${n ? ve.coffrets.map((c, i) => coffretCard(ve, c, i)).join('') : '<div class="card empty">Aucun coffret.<br>Appuie sur <b>+</b> pour ajouter le premier.</div>'}
    <button class="btn block" onclick="addCoffret()">+ Ajouter un coffret</button>
    ${ve.closed ? `<button class="btn block" onclick="reopenVe('${ve.id}')">↩️ Rouvrir la VE</button>`
                : `<button class="btn ok block" onclick="closeVe('${ve.id}')">✅ Clôturer la VE</button>`}
    <button class="btn block" onclick="editVe('${ve.id}')">✏️ Site et dates</button>
    <button class="btn block" style="color:var(--bad)" onclick="deleteVe('${ve.id}')">🗑 Supprimer la VE</button>`;
}
function editVe(id){
  const ve = S.ves.find(v => v.id === id);
  openSheet(`<h3>Site et dates</h3>
    <label>Nom du site</label><input id="evName" value="${esc(siteName(ve.siteId))}">
    <div class="grid2">
      <div><label>Début</label><input id="evStart" type="date" value="${dayInput(ve.start)}"></div>

function batEditor(b, i){

function setC(k, v){ const c = getC(); if (!c) return; c[k] = v; save(); }
function refreshBats(){ const c = getC(); if (c && $('batList')) $('batList').innerHTML = c.bats.map((b, i) => batEditor(b, i)).join(''); }

function addBat(){ const c = getC(); const last = c.bats[c.bats.length - 1]; c.bats.push({id: uid(), cap: last ? last.cap : 17, pose: last ? last.pose : '', replaced: false}); save(); refreshBats(); }
function delBat(id){ const c = getC(); snapshot(); c.bats = c.bats.filter(b => b.id !== id); save(); refreshBats(); offerUndo('Batterie supprimée'); }
function replaceBat(id){

function undoReplace(id){ const b = getC().bats.find(x => x.id === id); b.pose = b.oldPose || ''; b.replaced = false; delete b.oldPose; save(); refreshBats(); }
function deleteCoffret(){

/* ============ Récap & carnet ============ */
function batLine(b){
  const st = batStatus(b);
  return `12V ${b.cap}Ah posée ${fmtPose(b.pose)}` + (b.replaced ? ` (remplacée${b.oldPose ? ', ancienne posée ' + fmtPose(b.oldPose) : ''})` : (b.pose ? ` (${ageText(ageMonths(b.pose))}${st === 'bad' ? ' – à remplacer' : st === 'warn' ? ' – à prévoir' : ''})` : ''));
}
function coffretText(c, i){
  return `[${i+1}] ${c.label || 'Coffret ' + (i+1)} – ${typeLabel(c.type)}${c.loc ? ' – ' + c.loc : ''}\n`
    + `Batterie${c.bats.length>1?'s':''} : ${c.bats.length ? c.bats.map(batLine).join(' + ') : 'aucune'}\n`
    + `Sous tension : ${fmtNum(c.vOn) || '–'} V | Hors tension : ${fmtNum(c.vOff) || '–'} V | Conso : ${fmtNum(c.conso) || '–'} ${c.unit}`
    + (c.note ? `\nRemarque : ${c.note}` : '');
}
function recapText(ve){
  return `VE ${siteName(ve.siteId)} – du ${fmtDay(ve.start)}${ve.end ? ' au ' + fmtDay(ve.end) : ' (en cours)'}\n\n` + ve.coffrets.map(coffretText).join('\n\n');
}
async function copyText(t, msg){
  try { await navigator.clipboard.writeText(t); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast(msg || '📋 Copié');
}
let recapVe = null;
function showRecap(id){
  const ve = S.ves.find(v => v.id === id); recapVe = ve;
  openSheet(`<h3>📋 Récap pour le compte rendu</h3>
    <div class="sub" style="margin-bottom:8px">À recopier dans l'appli de la boîte. Tu peux tout copier, ou coffret par coffret.</div>
    <button class="btn primary block" onclick="copyText(recapText(recapVe),'📋 Récap complet copié')">📋 Copier tout</button>
    ${ve.coffrets.map((c, i) => `<div class="card" style="margin-top:10px">
      <div class="preview" style="max-height:none">${esc(coffretText(c, i))}</div>
      <button class="btn small block" onclick="copyText(coffretText(recapVe.coffrets[${i}],${i}),'📋 Coffret ${i+1} copié')">📋 Copier ce coffret</button>
    </div>`).join('') || '<div class="empty">Aucun coffret dans cette VE.</div>'}
    <button class="btn block" onclick="closeSheet()">Fermer</button>`);
}
function carnetAuto(ve){
  // Version courte (2 lignes max) : le détail est dans le récap et le rapport PDF
  const n = ve.coffrets.length;
  const d1 = new Date(ve.start), d2 = ve.end ? new Date(ve.end) : null;
  const dd = d => String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
  const period = d2 && fmtDay(ve.end) !== fmtDay(ve.start) ? `${dd(d1)} au ${fmtDay(ve.end)}` : fmtDay(ve.start);
  const repl = [], todo = [];
  ve.coffrets.forEach(c => c.bats.forEach(b => {
    if (b.replaced) repl.push(c.label || 'coffret');
    else if (batStatus(b) === 'bad') todo.push(c.label || 'coffret');
  }));
  const list = (arr, one, many) => arr.length === 1 ? `${one} : ${arr[0]}.` : arr.length === 2 ? `${many} : ${arr.join(', ')}.` : `${arr.length} ${many.toLowerCase()}.`;
  let t = `VE du ${period} : ${n} coffret${n>1?'s':''} contrôlé${n>1?'s':''}, tensions et conso relevées.`;
  if (repl.length) t += ' ' + list(repl, 'Batterie remplacée', 'Batteries remplacées');
  if (todo.length) t += ' ' + list(todo, 'Batterie à remplacer', 'Batteries à remplacer');
  if (!repl.length && !todo.length) t += ' Batteries OK.';
  return t;
}
let carnetVe = null;
function showCarnet(id){
  const ve = S.ves.find(v => v.id === id); carnetVe = ve;
  const text = ve.carnetEdited && ve.carnet ? ve.carnet : carnetAuto(ve);
  openSheet(`<h3>📒 Carnet de maintenance</h3>
    <div class="sub" style="margin-bottom:8px">Texte bref (2 lignes) préparé à partir de tes saisies. Modifie-le si besoin, puis copie-le.</div>
    <textarea id="carnetTxt" style="min-height:90px" oninput="carnetVe.carnet=this.value;carnetVe.carnetEdited=true;save()">${esc(text)}</textarea>
    <button class="btn primary block" onclick="copyText($('carnetTxt').value,'📋 Texte du carnet copié')">📋 Copier</button>
    <button class="btn block" onclick="carnetVe.carnetEdited=false;carnetVe.carnet='';save();showCarnet(carnetVe.id)">🔄 Régénérer depuis les saisies</button>
    <button class="btn ok block" onclick="makePdf(carnetVe.id)">📄 Générer le rapport PDF</button>
    <button class="btn block" onclick="closeSheet()">Fermer</button>`);
}


/* ============ Rapport PDF ============ */
const TEAL = [15, 76, 92], STATE_COL = {bad: [214, 69, 69], warn: [217, 138, 0], ok: [31, 157, 85], unknown: [102, 118, 132], repl: [27, 111, 133]};
const pdfSafe = t => String(t ?? '').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/…/g, '...')
  .replace(/[^\x20-\x7E -ÿ–—€\n]/g, '');   // jsPDF (polices standard) : alphabet latin uniquement
function pdfName(ve){
  const site = siteName(ve.siteId).replace(/[\\/:*?"<>|]/g, '').trim().slice(0, 50);
  const d = new Date(ve.end || ve.start);
  return `Rapport VE - ${site} - ${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}.pdf`;
}
function buildPdf(ve){
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit: 'mm', format: 'a4'});
  const W = 210, M = 14, CW = W - 2 * M;
  const bats = ve.coffrets.flatMap(c => c.bats.map(b => ({c, b, st: b.replaced ? 'repl' : batStatus(b)})));
  const nBad = bats.filter(x => x.st === 'bad').length, nRepl = bats.filter(x => x.st === 'repl').length, nWarn = bats.filter(x => x.st === 'warn').length;

  // En-tête
  doc.setFillColor(...TEAL); doc.rect(0, 0, W, 28, 'F');
  doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(17);
  doc.text(pdfSafe("Rapport de visite d'entretien"), M, 12);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  doc.text(pdfSafe("Relevé des batteries – coffrets d'alarme et de contrôle d'accès"), M, 19.5);
  doc.setFontSize(9); doc.text(pdfSafe(ve.closed ? 'VE clôturée' : 'VE en cours'), W - M, 12, {align: 'right'});

  // Informations
  let y = 38;
  const info = [['Site', siteName(ve.siteId)],
    ['Période', `du ${fmtDay(ve.start)}${ve.end ? ' au ' + fmtDay(ve.end) : ' (en cours)'}`],
    ['Technicien', S.settings.tech || '—']];
  info.forEach(([k, v]) => {
    doc.setTextColor(102, 118, 132); doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.text(pdfSafe(k), M, y);
    doc.setTextColor(22, 33, 42); doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text(pdfSafe(v), M + 26, y);
    y += 6.5;
  });

  // Résumé (4 cases)
  y += 2;
  const boxes = [['Coffrets', ve.coffrets.length, TEAL], ['Batteries', bats.length, TEAL],
    ['À remplacer', nBad, nBad ? STATE_COL.bad : STATE_COL.ok], ['Remplacées', nRepl, STATE_COL.repl]];
  const bw = (CW - 3 * 4) / 4;
  boxes.forEach(([lab, val, col], i) => {
    const x = M + i * (bw + 4);
    doc.setDrawColor(...col); doc.setLineWidth(0.5); doc.roundedRect(x, y, bw, 17, 2, 2, 'S');
    doc.setTextColor(...col); doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.text(String(val), x + bw / 2, y + 8.5, {align: 'center'});
    doc.setFontSize(8.5); doc.setFont('helvetica', 'normal'); doc.text(pdfSafe(lab), x + bw / 2, y + 14, {align: 'center'});
  });
  y += 25;

  const section = (title) => {
    if (y > 260) { doc.addPage(); y = 20; }
    doc.setTextColor(...TEAL); doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5); doc.text(pdfSafe(title), M, y);
    doc.setDrawColor(...TEAL); doc.setLineWidth(0.4); doc.line(M, y + 1.8, W - M, y + 1.8); y += 6;
  };
  const table = (head, body, opts) => {
    doc.autoTable(Object.assign({startY: y, head: [head.map(pdfSafe)], body: body.map(r => r.map(c => pdfSafe(c))), margin: {left: M, right: M},
      theme: 'grid', styles: {font: 'helvetica', fontSize: 8.8, cellPadding: 1.8, textColor: [22, 33, 42], lineColor: [210, 218, 223], lineWidth: 0.2},
      headStyles: {fillColor: TEAL, textColor: 255, fontStyle: 'bold', halign: 'center'},
      alternateRowStyles: {fillColor: [243, 247, 248]}}, opts || {}));
    y = doc.lastAutoTable.finalY + 9;
  };

  // 1. Mesures
  section('1. Mesures par coffret');
  if (ve.coffrets.length) table(['#', 'Coffret', 'Type', 'Localisation', 'Sous tension', 'Hors tension', 'Consommation'],
    ve.coffrets.map((c, i) => [i + 1, c.label || 'Coffret ' + (i + 1), typeLabel(c.type), c.loc || '—',
      num(c.vOn) !== null ? fmtNum(c.vOn) + ' V' : '—', num(c.vOff) !== null ? fmtNum(c.vOff) + ' V' : '—',
      num(c.conso) !== null ? fmtNum(c.conso) + ' ' + c.unit : '—']),
    {columnStyles: {0: {halign: 'center', cellWidth: 8}, 4: {halign: 'center'}, 5: {halign: 'center'}, 6: {halign: 'center'}}});
  else { doc.setFont('helvetica', 'italic'); doc.setFontSize(10); doc.setTextColor(102, 118, 132); doc.text('Aucun coffret.', M, y); y += 9; }

  // 2. Batteries
  section('2. État des batteries 12 V');
  const stLabel = {bad: 'À remplacer', warn: 'À prévoir', ok: 'OK', unknown: 'Date inconnue', repl: 'Remplacée'};
  if (bats.length) table(['Coffret', 'Capacité', 'Date de pose', 'Âge', 'État'],
    bats.map(x => [x.c.label || 'Coffret', x.b.cap + ' Ah', fmtPose(x.b.pose) + (x.b.replaced && x.b.oldPose ? ` (ancienne : ${fmtPose(x.b.oldPose)})` : ''),
      x.b.pose ? ageText(ageMonths(x.b.pose)) : '—', stLabel[x.st]]),
    {columnStyles: {1: {halign: 'center'}, 2: {halign: 'center'}, 3: {halign: 'center'}, 4: {halign: 'center', fontStyle: 'bold'}},
     didParseCell: d => { if (d.section === 'body' && d.column.index === 4) d.cell.styles.textColor = STATE_COL[bats[d.row.index].st]; }});
  doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); doc.setTextColor(102, 118, 132);
  doc.text(pdfSafe(`Remplacement conseillé tous les ${S.settings.ageYears} ans.${nWarn ? ` ${nWarn} batterie${nWarn>1?'s':''} à prévoir dans les ${S.settings.warnMonths} prochains mois.` : ''}`), M, y - 5);
  y += 1;

  // 3. Remarques
  const notes = ve.coffrets.filter(c => c.note);
  if (notes.length) { section('3. Remarques'); table(['Coffret', 'Remarque'], notes.map(c => [c.label || 'Coffret', c.note]), {columnStyles: {0: {cellWidth: 50, fontStyle: 'bold'}}}); }

  // 4. Carnet de maintenance
  section(`${notes.length ? 4 : 3}. Carnet de maintenance`);
  const carnet = pdfSafe(ve.carnetEdited && ve.carnet ? ve.carnet : carnetAuto(ve));
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(22, 33, 42);
  const lines = doc.splitTextToSize(carnet, CW - 8), h = lines.length * 4.6 + 7;
  if (y + h > 280) { doc.addPage(); y = 20; }
  doc.setFillColor(243, 247, 248); doc.setDrawColor(210, 218, 223); doc.roundedRect(M, y - 2, CW, h, 2, 2, 'FD');
  doc.text(lines, M + 4, y + 3.5); y += h + 6;

  // Pied de page
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setDrawColor(210, 218, 223); doc.setLineWidth(0.2); doc.line(M, 286, W - M, 286);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(102, 118, 132);
    doc.text(pdfSafe(`${siteName(ve.siteId)} – généré le ${new Date().toLocaleString('fr-FR')}`), M, 291);
    doc.text(`Page ${i} / ${n}`, W - M, 291, {align: 'right'});
  }
  return doc;
}
let lastPdf = null;
function makePdf(id){
  const ve = S.ves.find(v => v.id === id); if (!ve) return;
  if (!window.jspdf) return toast('Module PDF indisponible : recharge l\'appli avec du réseau');
  let blob;
  try { blob = buildPdf(ve).output('blob'); } catch(e) { return toast('Erreur PDF : ' + e.message); }
  const name = pdfName(ve);
  lastPdf = {blob, name};
  openSheet(`<h3>📄 Rapport PDF prêt</h3>
    <div class="sub">${esc(name)}</div>
    <button class="btn primary block" onclick="sharePdf()">📤 Partager (mail, WhatsApp, Drive…)</button>
    <button class="btn block" onclick="download(lastPdf.name, lastPdf.blob, 'application/pdf')">⬇️ Télécharger sur le téléphone</button>
    <button class="btn block" onclick="window.open(URL.createObjectURL(lastPdf.blob), '_blank')">👁️ Voir le rapport</button>
    <div class="hint" id="pdfOd">${odReady() ? '☁️ Envoi d\'une copie sur OneDrive › Rapports…' : 'Connecte OneDrive dans les Réglages pour garder automatiquement une copie de chaque rapport.'}</div>
    <button class="btn block" onclick="closeSheet()">Fermer</button>`);
  if (odReady()) odSavePdf(blob, name);
}
async function sharePdf(){
  if (!lastPdf) return;
  const file = new File([lastPdf.blob], lastPdf.name, {type: 'application/pdf'});
  try {
    if (navigator.canShare && navigator.canShare({files: [file]})) return await navigator.share({files: [file], title: lastPdf.name});
  } catch(e) { if (e.name === 'AbortError') return; }
  download(lastPdf.name, lastPdf.blob, 'application/pdf'); toast('Partage indisponible : rapport téléchargé');
}
async function odSavePdf(blob, name){
  try {
    const token = await odToken();
    await odPut(token, 'Rapports/' + name, blob, 'application/pdf');
    if ($('pdfOd')) $('pdfOd').textContent = '☁️ Copie enregistrée sur OneDrive › Applications › BATTERIES VE › Rapports';
  } catch(e) { if ($('pdfOd')) $('pdfOd').textContent = '☁️ Copie OneDrive impossible pour l\'instant : ' + odErrText(e); }
}

/* ============ Vue Batteries (tous sites) ============ */
function allBatteries(){
  // État le plus récent connu de chaque site = sa dernière VE
  const out = [];
  S.sites.forEach(site => {
    const ve = S.ves.filter(v => v.siteId === site.id).sort((a,b) => b.start - a.start)[0];
    if (!ve) return;
    ve.coffrets.forEach(c => c.bats.forEach(b => out.push({site, ve, c, b, st: batStatus(b), mo: ageMonths(b.pose)})));
  });
  return out.sort((a,b) => (b.mo ?? -1) - (a.mo ?? -1));
}
function renderBats(){
  const all = allBatteries();
  const sec = (st, title) => {
    const l = all.filter(x => x.st === st); if (!l.length) return '';
    return `<h2>${title} (${l.length})</h2>` + l.map(x => `<div class="card tap" onclick="go('ve','${x.ve.id}')">
      <div class="name">${esc(x.site.name)}</div>
      <div class="sub">${typeIcon(x.c.type)} ${esc(x.c.label || 'Coffret')}${x.c.loc ? ' · ' + esc(x.c.loc) : ''}</div>
      ${batPill(x.b)}</div>`).join('');
  };
  $('view').innerHTML = all.length ? `
    <div class="sub">Dernier état connu de chaque site (dernière VE). Remplacement conseillé tous les <b>${S.settings.ageYears} ans</b>.</div>
    ${sec('bad', '⚠️ À remplacer')}${sec('warn', `⏳ À prévoir (moins de ${S.settings.warnMonths} mois)`)}${sec('unknown', '❓ Date de pose inconnue')}
    <h2>✅ OK : ${all.filter(x => x.st === 'ok').length} batterie${all.filter(x => x.st === 'ok').length>1?'s':''}</h2>`
    : '<div class="empty">Aucune batterie enregistrée.<br>Elles apparaîtront ici dès ta première VE.</div>';
}
function updateBadges(){
  const n = allBatteries().filter(x => x.st === 'bad').length;
  $('batBadge').hidden = !n; $('batBadge').textContent = n;
}

/* ============ Réglages ============ */
function renderSettings(){
  $('view').innerHTML = `
    <h2>👷 Rapport PDF</h2>
    <div class="card">
      <label style="margin-top:0">Nom du technicien (affiché sur le rapport)</label>
      <input id="sTech" value="${esc(S.settings.tech || '')}" placeholder="ex. Aeden Becher" onchange="S.settings.tech=this.value.trim();save();toast('Nom enregistré')">
    </div>
    <h2>🔋 Alertes batteries</h2>
    <div class="card">
      <div class="grid2">
        <div><label>Remplacement tous les (ans)</label><input id="sAge" type="number" inputmode="numeric" min="1" value="${S.settings.ageYears}"></div>
        <div><label>Prévenir avant (mois)</label><input id="sWarn" type="number" inputmode="numeric" min="0" value="${S.settings.warnMonths}"></div>
      </div>
      <button class="btn primary block" onclick="saveSettings()">Enregistrer</button>
    </div>
    <h2>☁️ OneDrive (synchronisation automatique)</h2>
    <div class="card" id="odCard">${odSettingsHtml()}</div>
    <h2>Sauvegarde & export</h2>
    <div class="card">
      <div class="sub">Dernière sauvegarde manuelle : <b>${S.lastBackup ? fmtDate(S.lastBackup) : 'jamais'}</b></div>
      <button class="btn block" onclick="exportXlsx()">📊 Exporter en Excel</button>
      <button class="btn block" onclick="exportData()">⬇️ Exporter une sauvegarde</button>
      <button class="btn block" onclick="$('impJson').click()">⬆️ Importer une sauvegarde</button>
    </div>
    <div class="card"><button class="btn danger block" onclick="resetAll()">Tout effacer</button></div>
    <div class="sub center" style="margin:14px 0 4px">🔋 Batteries VE · <b>version ${APP_VERSION}</b> du ${APP_DATE}</div>`;
}
function saveSettings(){
  S.settings.ageYears = Math.max(1, parseInt($('sAge').value, 10) || 4);
  S.settings.warnMonths = Math.max(0, parseInt($('sWarn').value, 10) || 0);
  save(); toast('Réglages enregistrés'); render();
}
function download(name, content, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function exportData(){ S.lastBackup = Date.now(); save(); render(); download(`batteries-ve-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(S, null, 1), 'application/json'); }
function importData(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try { const d = JSON.parse(r.result); if (!Array.isArray(d.ves)) throw 0;
      if (!confirm(`Remplacer les données actuelles par cette sauvegarde (${d.ves.length} VE) ?`)) return;
      snapshot(); S = Object.assign(defaults(), d, {settings: Object.assign(defaults().settings, d.settings || {})}); save(); render(); offerUndo('Sauvegarde importée'); }
    catch(e){ toast('Fichier de sauvegarde invalide'); }
  };
  r.readAsText(file);
}
function resetAll(){
  if (!confirm('Effacer toutes les VE, sites et batteries de ce téléphone ?')) return;
  snapshot(); const keep = S.settings.odClientId; S = defaults(); S.settings.odClientId = keep; save(); render(); offerUndo('Données effacées');
}

/* ============ Excel ============ */
function buildXlsx(){
  const bats = allBatteries();
  const mes = [];
  S.ves.slice().sort((a,b) => b.start - a.start).forEach(ve => ve.coffrets.forEach(c => mes.push({ve, c})));
  return XlsxLite.tablesWorkbook([
    {name: 'Batteries', headers: ['Site', 'Coffret', 'Localisation', 'Type', 'Capacité (Ah)', 'Date de pose', 'Âge', 'Statut'],
     rows: bats.map(x => [x.site.name, x.c.label, x.c.loc, typeLabel(x.c.type), x.b.cap, fmtPose(x.b.pose), x.b.pose ? ageText(x.mo) : '', {bad:'À remplacer', warn:'À prévoir', ok:'OK', unknown:'Date inconnue'}[x.st]]),
     red: bats.map(x => x.st === 'bad'), center: [4, 5, 6, 7], widths: [28, 26, 26, 16, 12, 12, 14, 14]},
    {name: 'Mesures', headers: ['Début VE', 'Fin VE', 'Site', 'Coffret', 'Type', 'Sous tension (V)', 'Hors tension (V)', 'Conso', 'Unité', 'Batteries', 'Remarque'],
     rows: mes.map(({ve, c}) => [fmtDay(ve.start), fmtDay(ve.end), siteName(ve.siteId), c.label, typeLabel(c.type), num(c.vOn) ?? '', num(c.vOff) ?? '', num(c.conso) ?? '', c.unit, c.bats.map(b => `${b.cap}Ah ${fmtPose(b.pose)}${b.replaced ? ' (remplacée)' : ''}`).join(' + '), c.note || '']),
     center: [0, 1, 5, 6, 7, 8], widths: [12, 12, 26, 26, 16, 15, 15, 10, 7, 34, 34]},
    {name: 'Carnet', headers: ['Site', 'Début', 'Fin', 'Statut', 'Coffrets', 'Texte du carnet'],
     rows: S.ves.slice().sort((a,b) => b.start - a.start).map(ve => [siteName(ve.siteId), fmtDay(ve.start), fmtDay(ve.end), ve.closed ? 'Clôturée' : 'En cours', ve.coffrets.length, ve.carnetEdited && ve.carnet ? ve.carnet : carnetAuto(ve)]),
     center: [1, 2, 3, 4], widths: [26, 12, 12, 11, 9, 100]}
  ]);
}
function exportXlsx(){ download(`batteries-ve-${new Date().toISOString().slice(0,10)}.xlsx`, buildXlsx(), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); }

/* ============ Fenêtres ============ */
function openSheet(html){ $('sheet').innerHTML = html; $('sheetBg').classList.add('show'); $('undoBar').classList.remove('show'); }
function closeSheet(){ $('sheetBg').classList.remove('show'); if (undoSnap) $('undoBar').classList.add('show'); }

/* ============ Annuler ============ */
let undoSnap = null, undoTimer = null;
function snapshot(){ undoSnap = JSON.stringify(S); }
function setNavH(){ const n = document.querySelector('nav'); if (n) document.documentElement.style.setProperty('--navh', n.offsetHeight + 'px'); }
function offerUndo(msg){
  if (!undoSnap) return;
  $('undoMsg').textContent = msg; setNavH();
  if (!$('sheetBg').classList.contains('show')) $('undoBar').classList.add('show');
  document.body.classList.add('undo-on');
  clearTimeout(undoTimer); undoTimer = setTimeout(hideUndo, 15000);
}
function hideUndo(){ undoSnap = null; clearTimeout(undoTimer); $('undoBar').classList.remove('show'); document.body.classList.remove('undo-on'); }
function undo(){
  if (!undoSnap) return;
  S = JSON.parse(undoSnap); hideUndo(); save(); closeSheet(); render(); toast('↩️ Action annulée');
}
window.addEventListener('resize', setNavH);

/* ============ OneDrive (compte Microsoft personnel) ============ */
// Accès limité au dossier de l'appli : OneDrive › Applications › BATTERIES VE
const OD_SCOPES = ['Files.ReadWrite.AppFolder'];
const OD_KEY = 'batteriesVE_onedrive';
const GRAPH = 'https://graph.microsoft.com/v1.0/me/drive/special/approot';
const OD = {app: null, account: null, busy: false, again: false, timer: null, state: 'off', msg: ''};
let odMeta = (() => { try { return JSON.parse(localStorage.getItem(OD_KEY)) || {}; } catch(e){ return {}; } })();
if (odMeta.auto === undefined) odMeta.auto = true;
function odSaveMeta(){ try { localStorage.setItem(OD_KEY, JSON.stringify(odMeta)); } catch(e){} }
const odClientId = () => (S.settings.odClientId || '').trim();
const odReady = () => !!(OD.app && OD.account);
const odRedirect = () => location.origin + location.pathname.replace(/index\.html$/, '');
const isEmpty = () => !S.ves.length && !S.sites.length;

async function odInit(){
  odUi();
  if (!window.msal || !odClientId()) return;
  if (!/^[0-9a-f-]{36}$/i.test(odClientId())) return odSet('err', 'Identifiant d\'application invalide.');
  if (!location.protocol.startsWith('http')) return odSet('err', 'La connexion OneDrive ne marche que depuis l\'adresse en ligne de l\'appli.');
  try {
    OD.app = new msal.PublicClientApplication({auth: {clientId: odClientId(), authority: 'https://login.microsoftonline.com/consumers', redirectUri: odRedirect()}, cache: {cacheLocation: 'localStorage'}});
    await OD.app.initialize();
    const r = await OD.app.handleRedirectPromise();
    if (r && r.account) { OD.app.setActiveAccount(r.account); toast('✅ Connecté à OneDrive'); odMeta.pending = true; odSaveMeta(); }
    const acc = OD.app.getActiveAccount() || OD.app.getAllAccounts()[0];
    if (acc) { OD.app.setActiveAccount(acc); OD.account = acc; }
    if (location.hash.includes('code=') || location.hash.includes('error=')) history.replaceState(null, '', location.pathname + location.search);
  } catch(e) { return odSet('err', 'Connexion impossible : ' + odErrText(e)); }
  if (odReady()) {
    odSet(odMeta.pending ? 'wait' : 'ok');
    if (isEmpty()) setTimeout(() => { if (isEmpty()) odRestore(true); }, 600);
    else if (odMeta.pending && odMeta.auto) odSchedule(800);
  } else odSet('off');
}
function odErrText(e){
  const m = (e && (e.errorMessage || e.message || e.errorCode)) || String(e);
  if (/AADSTS700016|application.*not found/i.test(m)) return 'identifiant d\'application inconnu chez Microsoft.';
  if (/AADSTS50011|redirect/i.test(m)) return 'adresse de retour incorrecte dans la déclaration Microsoft (doit être ' + odRedirect() + ').';
  if (/AADSTS9002326|cross-origin|Single-Page/i.test(m)) return 'la plateforme doit être « Application monopage (SPA) ».';
  if (/user_cancelled|access_denied|consent/i.test(m)) return 'connexion annulée.';
  return m.slice(0, 160);
}
function odLogin(){ if (!OD.app) return toast('Enregistre d\'abord l\'identifiant'); OD.app.loginRedirect({scopes: OD_SCOPES, prompt: 'select_account'}).catch(e => odSet('err', odErrText(e))); }
async function odLogout(){
  if (!confirm('Déconnecter OneDrive ? Les fichiers déjà envoyés restent sur ton OneDrive.')) return;
  try { if (OD.app && OD.account) await OD.app.clearCache({account: OD.account}); } catch(e){}
  OD.account = null; odMeta = {auto: odMeta.auto}; odSaveMeta(); odSet('off'); render();
}
async function odToken(){
  try { return (await OD.app.acquireTokenSilent({scopes: OD_SCOPES, account: OD.account})).accessToken; }
  catch(e) { if (e instanceof msal.InteractionRequiredAuthError) odSet('err', 'Session expirée : appuie sur « Se reconnecter ».', true); throw e; }
}
function odSet(state, msg, needLogin){ OD.state = state; OD.msg = msg || ''; OD.needLogin = !!needLogin; odUi(); }
function odUi(){
  const b = $('odBadge'), d = $('odDot');
  if (b) { b.hidden = !odClientId(); d.className = 'oddot ' + ({ok:'ok', wait:'wait', busy:'wait', err:'err'}[OD.state] || ''); }
  if ($('odCard')) $('odCard').innerHTML = odSettingsHtml();
}
function odDirty(){
  if (!odClientId()) return;
  if (isEmpty()) { odMeta.pending = false; odSaveMeta(); return; } // rien à envoyer : OneDrive protégé
  odMeta.pending = true; odSaveMeta();
  if (odReady() && odMeta.auto) { if (OD.state !== 'busy') odSet('wait'); odSchedule(4000); }
}
function odSchedule(ms){ clearTimeout(OD.timer); OD.timer = setTimeout(() => odSync(), ms); }
async function odPut(token, name, body, type){
  const r = await fetch(`${GRAPH}:/${name.split('/').map(encodeURIComponent).join('/')}:/content`, {method: 'PUT', headers: {Authorization: 'Bearer ' + token, 'Content-Type': type}, body});
  if (!r.ok) throw new Error(`OneDrive a refusé ${name} (${r.status})`);
}
async function odSync(manual){
  if (!odReady()) return manual && toast('Connecte d\'abord OneDrive');
  if (OD.busy) { OD.again = true; return; }
  if (!navigator.onLine) { odSet('wait', 'Hors ligne : envoi dès le retour du réseau.'); return; }
  if (isEmpty()) { odMeta.pending = false; odSaveMeta(); odSet('wait', 'Aucune donnée sur ce téléphone : rien n\'est envoyé (OneDrive protégé).'); return; }
  OD.busy = true; OD.again = false; odSet('busy', 'Envoi en cours…');
  try {
    const token = await odToken();
    await odPut(token, 'batteries-ve.json', JSON.stringify(Object.assign({}, S, {exportedAt: new Date().toISOString()}), null, 1), 'application/json');
    await odPut(token, 'batteries-ve.xlsx', buildXlsx(), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    odMeta.pending = OD.again; odMeta.last = Date.now(); odSaveMeta();
    odSet(OD.again ? 'wait' : 'ok'); if (manual) toast('☁️ OneDrive à jour');
  } catch(e) {
    odMeta.pending = true; odSaveMeta();
    if (!OD.needLogin) { odSet('err', !navigator.onLine ? 'Hors ligne : envoi dès le retour du réseau.' : odErrText(e)); odSchedule(60000); }
  } finally { OD.busy = false; if (OD.again && odMeta.auto) odSchedule(1500); }
}
async function odRestore(auto){
  if (!odReady()) return auto || toast('Connecte d\'abord OneDrive');
  try {
    const token = await odToken(), auth = {headers: {Authorization: 'Bearer ' + token}};
    const r = await fetch(`${GRAPH}/children?$top=200`, auth);
    if (!r.ok) throw new Error('liste des fichiers : erreur ' + r.status);
    const files = ((await r.json()).value || []).filter(f => /\.json$/i.test(f.name));
    let best = null;
    for (const f of files) {
      try {
        let url = f['@microsoft.graph.downloadUrl'];
        if (!url && f.id) { const m = await fetch(`https://graph.microsoft.com/v1.0/me/drive/items/${f.id}`, auth); if (m.ok) url = (await m.json())['@microsoft.graph.downloadUrl']; }
        const d = url ? await (await fetch(url)).json() : await (await fetch(`https://graph.microsoft.com/v1.0/me/drive/items/${f.id}/content`, auth)).json();
        if (!Array.isArray(d.ves) || !d.ves.length) continue;
        const when = Date.parse(d.exportedAt || f.lastModifiedDateTime);
        if (!best || when > best.when) best = {d, when, name: f.name};
      } catch(e) {}
    }
    if (!best) return auto || toast('Aucune sauvegarde avec des VE sur OneDrive');
    snapshot();
    const d = best.d; delete d.exportedAt;
    S = Object.assign(defaults(), d, {settings: Object.assign(defaults().settings, d.settings || {}, {odClientId: odClientId() || (d.settings || {}).odClientId})});
    save(); render(); offerUndo(`📥 ${S.ves.length} VE récupérée${S.ves.length>1?'s':''} depuis OneDrive`);
  } catch(e) { toast('Récupération impossible : ' + odErrText(e)); }
}
function odSaveClientId(){
  const v = ($('odClient').value || '').trim();
  if (v && !/^[0-9a-f-]{36}$/i.test(v)) return toast('Identifiant invalide (format 1a2b3c4d-…)');
  S.settings.odClientId = v; save(); OD.app = null; OD.account = null; odInit(); toast(v ? 'Identifiant enregistré' : 'Identifiant effacé'); render();
}
function odSettingsHtml(){
  const cid = odClientId();
  const dot = s => `<span class="oddot ${s}" style="position:static;display:inline-block;border-color:var(--card)"></span>`;
  if (!cid) return `
    <div class="sub">Copie automatique de tes VE (sauvegarde + Excel) sur <b>ton OneDrive personnel</b>, dans le seul dossier <b>Applications › BATTERIES VE</b>.</div>
    <label>Identifiant de l'application (Client ID)</label>
    <input id="odClient" placeholder="ex. 1a2b3c4d-5e6f-…" autocomplete="off">
    <button class="btn primary block" onclick="odSaveClientId()">Enregistrer l'identifiant</button>`;
  if (!odReady()) return `
    <div class="odstat">${dot(OD.state === 'err' ? 'err' : '')} <span>${OD.state === 'err' ? esc(OD.msg) : 'Non connecté'}</span></div>
    <button class="btn primary block" onclick="odLogin()">🔑 Se connecter à mon compte Microsoft</button>
    <div class="hint">Utilise le même compte que pour l'appli de stock (celui de ton OneDrive).</div>
    <details style="margin-top:10px"><summary class="sub">Identifiant de l'application</summary>
      <input id="odClient" value="${esc(cid)}" style="margin-top:6px"><button class="btn block" onclick="odSaveClientId()">Modifier</button></details>`;
  const st = {ok: ['ok', 'À jour'], wait: ['wait', 'Modifications en attente d\'envoi'], busy: ['wait', 'Envoi en cours…'], err: ['err', OD.msg]}[OD.state] || ['', ''];
  return `
    <div class="odstat">${dot(st[0])} <b>${esc(st[1] || '')}</b></div>
    ${OD.state === 'wait' && OD.msg ? `<div class="sub">${esc(OD.msg)}</div>` : ''}
    <div class="sub">Compte : <b>${esc(OD.account.username || '')}</b><br>Dernier envoi : <b>${odMeta.last ? fmtDate(odMeta.last) : 'jamais'}</b></div>
    <label style="display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px;color:var(--text)">
      <input type="checkbox" class="check" ${odMeta.auto ? 'checked' : ''} onchange="odMeta.auto=this.checked;odSaveMeta();if(this.checked)odDirty()"> Envoi automatique après chaque modification</label>
    ${OD.needLogin ? `<button class="btn primary block" onclick="odLogin()">🔑 Se reconnecter</button>` : ''}
    <button class="btn block" onclick="odSync(true)">🔄 Synchroniser maintenant</button>
    <button class="btn block" onclick="odRestore()">📥 Récupérer mes données depuis OneDrive</button>
    <div class="hint">Fichiers : <b>batteries-ve.xlsx</b> (onglets Batteries, Mesures, Carnet) et <b>batteries-ve.json</b> (sauvegarde complète).</div>
    <button class="btn block" onclick="odLogout()">Déconnecter OneDrive</button>`;
}
window.addEventListener('online', () => { if (odReady() && odMeta.pending && odMeta.auto) odSchedule(1500); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !odReady()) return;
  if (isEmpty()) odRestore(true); else if (odMeta.pending && odMeta.auto) odSchedule(1500);
});

/* ============ Démarrage ============ */
render();
odInit();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
